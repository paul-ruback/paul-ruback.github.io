<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ip . pr</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Spectral:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  /* ──────────── numeric field background ──────────── */
  #nf-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
    display: block;
  }
  #nf-invert {
    position: fixed;
    top: 24px; right: 24px;
    width: 28px; height: 28px;
    border-radius: 50%;
    z-index: 9100;
    cursor: pointer;
    overflow: hidden;
    border: 1px solid rgba(26, 26, 26, 0.4);
    background: conic-gradient(
      from 0deg,
      rgb(0, 175, 215) 0deg 90deg,
      rgb(225, 35, 130) 90deg 180deg,
      rgb(0, 175, 215) 180deg 270deg,
      rgb(225, 35, 130) 270deg 360deg
    );
    transition: transform 600ms cubic-bezier(0.4,0,0.2,1), border-color 600ms ease;
  }
  #nf-invert::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #1a1a1a;
    transform: translate(-50%,-50%);
    transition: background 600ms ease;
  }
  body.nf-inverted #nf-invert { transform: rotate(180deg); border-color: rgba(245,243,238,0.4); }
  body.nf-inverted #nf-invert::after { background: #f5f3ee; }
  body.nf-inverted { --wr-ink-3: #6e6e6e; --ow-ink-3: #6e6e6e; --ct-ink-3: #6e6e6e; }
  body.nf-inverted .ow-tile,
  body.nf-inverted .ic-tile,
  body.nf-inverted #ps-tile { border-color: rgba(245,243,238,0.45); }
  body.nf-inverted .ow-tile-label,
  body.nf-inverted .ic-tile-label,
  body.nf-inverted .ps-tile-lbl { color: rgba(245,243,238,0.85); }

  /* Inverted stage backgrounds and labels */
  body.nf-inverted .ow-stage  { background: rgba(22,22,21,0.97); }
  body.nf-inverted .ow-stage-title,
  body.nf-inverted .ow-hud,
  body.nf-inverted .ow-hint   { color: rgba(230,229,224,0.35); }
  body.nf-inverted .ow-banner { background: rgba(22,22,21,0.92); border-color: rgba(245,243,238,0.18); }
  body.nf-inverted .ow-banner-title { color: rgba(230,229,224,0.85); }
  body.nf-inverted .ow-banner-sub   { color: rgba(230,229,224,0.45); }
  body.nf-inverted .ow-banner-btn   { color: rgba(230,229,224,0.75); border-color: rgba(245,243,238,0.35); }

  /* Outward SVG elements — static ones inherit ink via CSS */
  body.nf-inverted .ow-tile-svg circle,
  body.nf-inverted .ow-tile-svg polygon { stroke: rgba(230,229,224,0.75); }
  body.nf-inverted #ow-mouth,
  body.nf-inverted #ow-spokes line,
  body.nf-inverted #ow-ship polygon { stroke: rgba(230,229,224,0.75); }
  body.nf-inverted #ow-fire-btn circle:first-child { fill: rgba(22,22,21,0.7); stroke: rgba(230,229,224,0.65); }
  body.nf-inverted #ow-fire-btn circle:last-child  { fill: rgba(230,229,224,0.75); }

  body.nf-inverted .ic-stage  { background: rgba(22,22,21,0.97); }
  body.nf-inverted .ic-stage-title,
  body.nf-inverted .ic-state-label,
  body.nf-inverted .ic-interaction-hint,
  body.nf-inverted .ic-hint   { color: rgba(230,229,224,0.35); }
  body.nf-inverted .ic-desc-overlay { background: rgba(22,22,21,0.95); }
  body.nf-inverted .ic-back-eyebrow { color: rgba(230,229,224,0.35); }
  body.nf-inverted .ic-back-title   { color: rgba(230,229,224,0.88); }
  body.nf-inverted .ic-back-sub     { color: rgba(230,229,224,0.45); }
  body.nf-inverted .ic-back-divider { background: rgba(245,243,238,0.12); }
  body.nf-inverted .ic-back-body    { color: rgba(230,229,224,0.70); }

  /* home button */
  #nf-home {
    position: fixed;
    top: 24px; left: 24px;
    width: 28px; height: 28px;
    border-radius: 50%;
    z-index: 9100;
    cursor: pointer;
    border: 1px solid rgba(26,26,26,0.4);
    background: rgba(245,243,238,0.7);
    color: rgba(26,26,26,0.7);
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
    font-family: 'Space Mono', ui-monospace, monospace;
    font-size: 14px; line-height: 1;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease;
  }
  #nf-home:hover { border-color: rgba(26,26,26,0.9); color: rgba(26,26,26,1); }
  body.nf-inverted #nf-home { background: rgba(22,22,21,0.7); border-color: rgba(245,243,238,0.4); color: rgba(245,243,238,0.7); }
  body.nf-inverted #nf-home:hover { border-color: rgba(245,243,238,0.9); color: rgba(245,243,238,1); }

  /* ──────────── layout: vertical stack, tiles centered ──────────── */
  .diamond-grid {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 24px auto 24px;
    padding: 0;
    gap: 24px;
  }

  /* Tile backgrounds */
  .ow-tile, #ps-tile, .ic-tile {
    background: rgba(245,243,238,0.7);
  }
  body.nf-inverted .ow-tile,
  body.nf-inverted #ps-tile,
  body.nf-inverted .ic-tile { background: rgba(22,22,21,0.7); }
</style>

<style>
  /* ──────────── Plato — Regular Solids ──────────── */
  #ps-root, #ps-root * { box-sizing: border-box; }
  #ps-root {
    --ps-ink:   #1a1a1a;
    --ps-ink-2: #5a5a5a;
    --ps-ink-3: #9a9a9a;
    --ps-mono:  ui-monospace, "SF Mono", Menlo, monospace;
    --ps-serif: 'Spectral', Georgia, serif;
    position: relative; width: 220px;
    font-family: var(--ps-serif); color: var(--ps-ink);
  }

  /* ── tile ── */
  #ps-tile {
    position: relative;
    width: 220px; height: 220px;
    border: 1px solid var(--ps-ink-3);
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    transition: transform 0.25s ease, border-color 0.25s ease;
  }
  #ps-tile:hover { border-color: var(--ps-ink); transform: scale(1.02); }
  #ps-tile-canvas { width: 150px; height: 150px; display: block; }
  .ps-tile-lbl {
    font-family: var(--ps-mono); font-size: 10px;
    letter-spacing: 0.24em; text-transform: uppercase; color: var(--ps-ink-2);
  }

  /* ── stage: open playfield, no card ── */
  #ps-stage {
    position: fixed; inset: 0; z-index: 9000;
    display: flex; align-items: center; justify-content: center;
    background: rgba(245,243,238,0.97);
    opacity: 0; pointer-events: none;
    transition: opacity 0.28s ease;
    user-select: none; -webkit-user-select: none;
  }
  #ps-stage.open { opacity: 1; pointer-events: all; }

  /* Playfield: smaller than Outward's to leave a generous click-out margin
     on all sides — at 1440px desktop this gives ~240px on each side. */
  .ps-playfield {
    position: relative;
    width: min(560px, 80vw);
    height: min(560px, 80vw);
    max-width: 560px; max-height: 560px;
  }

  #ps-stage-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block; cursor: pointer;
  }

  /* Top-left: title + solid name on one line */
  .ps-hud {
    position: absolute;
    font-family: var(--ps-mono); font-size: 10px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ps-ink-3); pointer-events: none;
    white-space: nowrap;
  }
  .ps-hud.left  { top: 0; left: 0; }
  /* Top-right: F/V/E — clear of the title */
  .ps-hud.right { top: 0; right: 0; text-align: right; }

  /* Next-solid hint — appears just above the midpoint, clear of both HUDs */
  .ps-next-hint {
    position: absolute; top: 44px; left: 50%;
    transform: translateX(-50%);
    font-family: var(--ps-serif); font-size: 10px;
    font-weight: 300; font-style: italic;
    color: rgba(17,17,16,0.3); white-space: nowrap;
    pointer-events: none; opacity: 0; transition: opacity 0.5s;
  }
  .ps-next-hint.visible { opacity: 1; }

  /* Cycle counter — below the right HUD, not on top of it */
  .ps-counter {
    position: absolute; top: 18px; right: 0;
    font-family: var(--ps-mono); font-size: 8px;
    letter-spacing: 0.12em; color: rgba(17,17,16,0.18);
    pointer-events: none;
  }

  /* Bottom stack — three layers, each with room to breathe */
  /* Euler equation: fades in during transitions */
  .ps-euler {
    position: absolute; bottom: 52px; left: 50%;
    transform: translateX(-50%);
    font-family: var(--ps-mono); font-size: 8px;
    letter-spacing: 0.06em; color: rgba(17,17,16,0.22);
    pointer-events: none; opacity: 0;
    transition: opacity 0.4s; white-space: nowrap;
  }
  /* Solid description (italic Spectral) */
  .ps-solid-name {
    position: absolute; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    font-family: var(--ps-serif); font-size: 12px;
    font-weight: 300; font-style: italic;
    color: rgba(17,17,16,0.42);
    white-space: nowrap; pointer-events: none;
    transition: opacity 0.4s;
  }
  /* State prompt (tap to decompose / tap to rebuild) */
  .ps-hint {
    position: absolute; bottom: 10px; left: 50%;
    transform: translateX(-50%);
    font-family: var(--ps-mono); font-size: 9px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ps-ink-3); white-space: nowrap;
    pointer-events: none;
  }

  /* Inverted overrides */
  body.nf-inverted #ps-stage { background: rgba(22,22,21,0.97); }
  body.nf-inverted .ps-hud       { color: rgba(230,229,224,0.28); }
  body.nf-inverted .ps-solid-name{ color: rgba(230,229,224,0.40); }
  body.nf-inverted .ps-hint      { color: rgba(230,229,224,0.25); }
  body.nf-inverted .ps-next-hint { color: rgba(230,229,224,0.25); }
  body.nf-inverted .ps-euler     { color: rgba(230,229,224,0.22); }
  body.nf-inverted .ps-counter   { color: rgba(230,229,224,0.18); }
</style>

<style>
  /* ──────────── Outward ──────────── */
  #ow-root, #ow-root * { box-sizing: border-box; }
  #ow-root {
    --ow-ink: #1a1a1a; --ow-ink-2: #5a5a5a; --ow-ink-3: #9a9a9a;
    --ow-bg: #f5f3ee;
    --ow-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --ow-serif: 'Spectral', Georgia, serif;
    position: relative; width: 220px;
    font-family: var(--ow-serif); color: var(--ow-ink);
  }
  .ow-tile {
    position: relative; width: 220px; height: 220px;
    border: 1px solid var(--ow-ink-3); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    transition: transform 0.25s ease, border-color 0.25s ease;
  }
  .ow-tile:hover { border-color: var(--ow-ink); transform: scale(1.02); }
  .ow-tile-svg { width: 110px; height: 110px; }
  .ow-tile-label { font-family: var(--ow-mono); font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ow-ink-2); }
  @keyframes ow-tile-orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .ow-tile-orbit { transform-origin: 55px 55px; animation: ow-tile-orbit 16s linear infinite; }
  .ow-stage {
    position: fixed; inset: 0; background: rgba(245,243,238,0.97);
    z-index: 9000; display: none; align-items: center; justify-content: center;
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .ow-stage.open { display: flex; animation: ow-fadein 0.3s ease forwards; touch-action: none; }
  @keyframes ow-fadein { from { opacity: 0; } to { opacity: 1; } }
  .ow-playfield { position: relative; width: min(900px,92vw); height: min(680px,90vh); max-width: 900px; max-height: 680px; }
  .ow-stage-title { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-family: var(--ow-mono); font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ow-ink-3); pointer-events: none; }
  #ow-svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .ow-hud { position: absolute; top: 24px; font-family: var(--ow-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ow-ink-2); pointer-events: none; }
  .ow-hud.left { left: 28px; } .ow-hud.right { right: 28px; }
  /* Remaining-asteroid pips — small filled circles, one per asteroid */
  #ow-pips { display: inline-flex; gap: 5px; align-items: center; }
  .ow-pip {
    width: 5px; height: 5px; border-radius: 50%;
    background: #1a1a1a; display: inline-block;
    transition: opacity 0.2s ease;
  }
  .ow-hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-family: var(--ow-mono); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ow-ink-3); pointer-events: none; text-align: center; }
  .ow-banner {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    display: none; flex-direction: column; align-items: center; gap: 14px;
    z-index: 10; pointer-events: auto; padding: 32px 40px;
    background: rgba(245,243,238,0.96); border: 1px solid var(--ow-ink); min-width: 280px;
  }
  .ow-banner.show { display: flex; }
  .ow-banner-title { font-family: var(--ow-serif); font-style: italic; font-size: 1.9rem; color: var(--ow-ink); text-align: center; }
  .ow-banner-sub { font-family: var(--ow-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ow-ink-2); text-align: center; }
  .ow-banner-btn { margin-top: 8px; font-family: var(--ow-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; background: transparent; color: var(--ow-ink); border: 1px solid var(--ow-ink); padding: 8px 18px; cursor: pointer; }
  .ow-banner-btn:hover { background: var(--ow-ink); color: var(--ow-bg); }
</style>

<style>
  /* ──────────── Ideas ──────────── */
  #ic-root, #ic-root * { box-sizing: border-box; }
  #ic-root {
    --ic-ink:   #1a1a1a; --ic-ink-2: #5a5a5a; --ic-ink-3: #9a9a9a;
    --ic-bg:    rgba(245,243,238,0.96);
    --ic-rule:  rgba(0,0,0,0.14);
    --ic-mono:  ui-monospace, "SF Mono", Menlo, monospace;
    --ic-serif: 'Spectral', Georgia, serif;
    position: relative;
    font-family: var(--ic-serif); color: var(--ic-ink);
  }
  /* Tile — identical layout to .ow-tile and #ps-tile */
  .ic-tile {
    width: 220px; height: 220px; border: 1px solid var(--ic-ink-3);
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    transition: transform 0.25s ease, border-color 0.25s ease;
    position: relative;
  }
  .ic-tile:hover { border-color: var(--ic-ink); transform: scale(1.02); }
  .ic-tile-label {
    font-family: var(--ic-mono); font-size: 10px;
    letter-spacing: 0.24em; text-transform: uppercase; color: var(--ic-ink-2);
  }

  /* Resonance tile canvas — same size as Plato's tile canvas */
  .resonance-tile { padding: 0; }
  #resonance-canvas { display: block; pointer-events: none; }

  /* ── Stage: open playfield, no box — matches Plato/Outward ── */
  .ic-stage {
    position: fixed; inset: 0; background: rgba(245,243,238,0.97);
    z-index: 9000; display: none; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  .ic-stage.open { display: flex; animation: ic-fadein 0.28s ease forwards; }
  @keyframes ic-fadein { from { opacity: 0; } to { opacity: 1; } }

  .ic-playfield {
    position: relative;
    width: min(560px, 80vw); height: min(560px, 80vw);
    max-width: 560px; max-height: 560px;
  }

  #ic-stage-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block; cursor: crosshair;
  }

  /* HUD labels — same approach as Plato */
  .ic-stage-title {
    position: absolute; top: 0; left: 50%;
    transform: translateX(-50%);
    font-family: var(--ic-mono); font-size: 10px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ic-ink-3); pointer-events: none; white-space: nowrap;
  }
  .ic-state-label {
    position: absolute; bottom: 28px; left: 50%;
    transform: translateX(-50%);
    font-family: var(--ic-mono); font-size: 9px; letter-spacing: 0.26em;
    text-transform: uppercase; color: var(--ic-ink-3);
    transition: color 0.8s ease; pointer-events: none; white-space: nowrap;
  }
  .ic-state-label.coupling  { color: var(--ic-ink-2); }
  .ic-state-label.resonance { color: var(--ic-ink);   }
  .ic-state-label.flow      { color: var(--ic-ink); }

  .ic-interaction-hint {
    position: absolute; bottom: 10px; left: 50%;
    transform: translateX(-50%);
    font-family: var(--ic-mono); font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ic-ink-3);
    pointer-events: none; white-space: nowrap;
  }

  .ic-hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-family: var(--ic-mono); font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ic-ink-3);
    pointer-events: none; user-select: none; z-index: 9001;
  }

  /* Description overlay: fades in at Sustained Flow, over the animation */
  .ic-desc-overlay {
    position: absolute; inset: 0;
    background: rgba(245,243,238,0.95);
    padding: 44px 40px 36px;
    display: flex; flex-direction: column; gap: 18px;
    overflow-y: auto;
    opacity: 0; pointer-events: none;
    transition: opacity 1.2s ease;
  }
  .ic-desc-overlay.revealed { opacity: 1; pointer-events: auto; }

  .ic-back-eyebrow {
    font-family: var(--ic-mono); font-size: 9px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--ic-ink-3);
  }
  .ic-back-title {
    font-family: var(--ic-serif); font-weight: 400; font-size: 1.9rem;
    line-height: 1.15; color: var(--ic-ink); margin: 0; letter-spacing: -0.01em;
  }
  .ic-back-sub {
    font-family: var(--ic-mono); font-size: 9px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ic-ink-2); margin-top: -8px;
  }
  .ic-back-divider { height: 1px; background: var(--ic-rule); flex-shrink: 0; }
  .ic-back-body {
    font-family: var(--ic-serif); font-size: 0.95rem; line-height: 1.65;
    color: var(--ic-ink); margin: 0;
  }
</style>

</head>
<body>

<canvas id="nf-canvas"></canvas>
<a id="nf-home" href="https://paul-ruback.github.io/" aria-label="home" title="home">←</a>
<button id="nf-invert" aria-label="invert field" title="invert"></button>

<div class="diamond-grid">

<!-- ── Outward ── -->
<div id="ow-root">
  <div class="ow-tile" id="ow-tile">
    <svg class="ow-tile-svg" viewBox="0 0 110 110">
      <circle cx="55" cy="55" r="36" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
      <circle cx="55" cy="55" r="8" fill="none" stroke="#1a1a1a" stroke-width="0.6" opacity="0.4"/>
      <g class="ow-tile-orbit">
        <polygon points="55,91 60,98 50,98" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-linejoin="round"/>
      </g>
    </svg>
    <div class="ow-tile-label">outward</div>
  </div>

  <div class="ow-stage" id="ow-stage">
    <div class="ow-playfield" id="ow-playfield">
      <div class="ow-stage-title">outward</div>
      <div class="ow-hud left">level · <span id="ow-level">1</span></div>
      <div class="ow-hud right"><span id="ow-pips"></span></div>
      <svg id="ow-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" style="cursor:crosshair;">
        <circle id="ow-mouth" cx="500" cy="350" r="240" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
        <g id="ow-spokes" stroke="#1a1a1a" stroke-width="0.5" opacity="0.18">
          <line x1="500" y1="350" x2="500" y2="110"/>
          <line x1="500" y1="350" x2="670" y2="180"/>
          <line x1="500" y1="350" x2="740" y2="350"/>
          <line x1="500" y1="350" x2="670" y2="520"/>
          <line x1="500" y1="350" x2="500" y2="590"/>
          <line x1="500" y1="350" x2="330" y2="520"/>
          <line x1="500" y1="350" x2="260" y2="350"/>
          <line x1="500" y1="350" x2="330" y2="180"/>
        </g>
        <g id="ow-depth-rings"></g>
        <g id="ow-portal" opacity="0.4"></g>
        <g id="ow-asteroids"></g>
        <g id="ow-shots"></g>
        <g id="ow-ship" transform="translate(500 540) rotate(-90)" style="pointer-events:none;">
          <polygon points="0,-14 11,11 -11,11" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-linejoin="round"/>
        </g>
        <!-- Mobile fire button: tap to fire, bottom-centre -->
        <g id="ow-fire-btn" style="cursor:pointer;">
          <circle cx="500" cy="640" r="28" fill="rgba(245,243,238,0.7)" stroke="#1a1a1a" stroke-width="1"/>
          <circle cx="500" cy="640" r="5" fill="#1a1a1a" opacity="0.7"/>

<!-- ═══════════════════════════════════════════════════════════════
     NUMERIC FIELD  —  optimized pixel-buffer renderer
     ═══════════════════════════════════════════════════════════════
     Key changes from original:
     • Uses ImageData (direct pixel writes) instead of arc() per grain.
       Writing RGBA bytes is ~8× faster than beginPath/arc/fill sequences.
     • Three CMYK channels are blended INTO the pixel buffer in one pass
       (multiply composite done in JS) — no repeated canvas state changes.
     • CELL_PX raised 4.5 → 5.5: cuts grain count ~33% at imperceptible
       visual cost (field still reads as continuous halftone).
     • Shove / kick / spring physics unchanged — only the paint step differs.
     ═══════════════════════════════════════════════════════════════ -->
<script>
(function () {
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  function init() {
    // ── grain configuration ──────────────────────────────────────
    const CELL_PX       = 5.5;
    const SETTLE_JITTER = 0.7;
    const GRAIN_HALF    = 1.1;

    // ── physics ──────────────────────────────────────────────────
    const ATTRACT_RADIUS   = 140;
    const ATTRACT_STRENGTH = 0.038;
    const SETTLE_RATE      = 0.055;
    const VELOCITY_DAMPING = 0.97;
    const MAX_DISPLACEMENT = 55;

    const REVERB_KICK_VELOCITY = 4.2;
    const REVERB_KICK_RADIUS   = 420;

    const SHOVE_RADIUS    = 60;
    const SHOVE_STRENGTH  = 0.085;
    const SHOVE_MIN_SPEED = 0.02;

    const GATHER_RADIUS     = 260;
    const GATHER_STRENGTH   = 0.11;
    const DISPERSE_VELOCITY = 5.2;
    const DISPERSE_RADIUS   = 300;

    // ── inversion ────────────────────────────────────────────────
    const INVERSION_LERP = 0.04;
    let polarity       = 1;
    let targetPolarity = 1;
    const PAPER_LIGHT = [245, 243, 238];
    const PAPER_DARK  = [22,  22,  22 ];

    // ── CMYK channel colors (C, M, K) ───────────────────────────
    // Stored as [r, g, b] for direct pixel manipulation.
    const CHANNELS = [
      [0,   175, 215],   // C
      [225, 35,  130],   // M
      [30,  30,  30 ],   // K
    ];

    // ── canvas setup ─────────────────────────────────────────────
    const canvas = document.getElementById("nf-canvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");

    let W = 0;
    let H = 0;
    let dpr = window.devicePixelRatio || 1;
    let grains = [];      // { rx, ry, x, y, vx, vy }
    let imgData = null;   // reused ImageData buffer
    let ready = false;    // true once first valid setupCanvas completes

    function setupCanvas() {
      // Read layout dimensions; fall back gracefully if layout isn't settled yet.
      const newW = window.innerWidth  || document.documentElement.clientWidth  || 0;
      const newH = window.innerHeight || document.documentElement.clientHeight || 0;
      if (newW < 1 || newH < 1) return;   // not yet laid out — skip silently

      W = newW;
      H = newH;
      dpr = window.devicePixelRatio || 1;

      const pw = Math.round(W * dpr);
      const ph = Math.round(H * dpr);
      if (pw < 1 || ph < 1) return;       // still zero after rounding — skip

      canvas.width  = pw;
      canvas.height = ph;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Allocate ImageData once per resize.
      imgData = ctx.createImageData(pw, ph);
      ready = true;

      const cols = Math.floor(W / CELL_PX);
      const rows = Math.floor(H / CELL_PX);
      const offX = (W - cols * CELL_PX) / 2 + CELL_PX / 2;
      const offY = (H - rows * CELL_PX) / 2 + CELL_PX / 2;
      grains = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const jx = (Math.random() - 0.5) * 2 * SETTLE_JITTER;
          const jy = (Math.random() - 0.5) * 2 * SETTLE_JITTER;
          const rx = offX + c * CELL_PX + jx;
          const ry = offY + r * CELL_PX + jy;
          grains.push({ rx, ry, x: rx, y: ry, vx: 0, vy: 0 });
        }
      }
    }
    // Defer first setup to next animation frame so window.innerWidth is
    // guaranteed non-zero. Retries until layout is settled.
    function trySetup() {
      setupCanvas();
      if (!ready) requestAnimationFrame(trySetup);
    }
    requestAnimationFrame(trySetup);

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(setupCanvas, 120);
    });

    // ── attraction source ─────────────────────────────────────────
    const source = { x: 0, y: 0, prevX: 0, prevY: 0, lastMoveTs: 0, active: false, pressed: false };

    // applyKick fires on click/tap and on cursor-leave.
    // Wave envelope: sin(π × normalised_dist × WAVE_COUNT) creates
    // WAVE_COUNT concentric ripple rings — grains near the wavecrest
    // get a strong kick, grains between crests get a counter-kick,
    // producing the pond-ripple alternation rather than a uniform push.
    const WAVE_COUNT = 3.5;   // more rings across the wider radius
    function applyKick(x, y) {
      for (let i = 0; i < grains.length; i++) {
        const g = grains[i];
        const dx = x - g.x, dy = y - g.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 0.5 || dist > REVERB_KICK_RADIUS) continue;
        const tNorm    = dist / REVERB_KICK_RADIUS;     // 0 (near) → 1 (far)
        // Linear envelope (was quadratic) — distant grains get a real kick,
        // not a vanishingly small one. The wave reads as a true ripple
        // rather than a localised pulse.
        const envelope = 1 - tNorm;
        const wave     = Math.sin(tNorm * Math.PI * WAVE_COUNT);
        const k = REVERB_KICK_VELOCITY * envelope * wave * polarity;
        g.vx += (dx / dist) * k;
        g.vy += (dy / dist) * k;
      }
    }

    // Dispersal burst on mouse-up: pushes grains AWAY from release point.
    // Opposite direction to applyKick — dx/dy points grain→cursor, so
    // negating the force vector pushes grains outward.
    function applyDisperse(x, y) {
      for (let i = 0; i < grains.length; i++) {
        const g = grains[i];
        const dx = g.x - x, dy = g.y - y;   // outward from cursor
        const dist = Math.hypot(dx, dy);
        if (dist < 0.5 || dist > DISPERSE_RADIUS) continue;
        const t = 1 - dist / DISPERSE_RADIUS;
        const k = DISPERSE_VELOCITY * t * t;
        g.vx += (dx / dist) * k;
        g.vy += (dy / dist) * k;
      }
    }

    function applyShove(cx, cy, vx, vy, speed) {
      if (speed < SHOVE_MIN_SPEED) return;
      const dirX = vx / speed, dirY = vy / speed;
      const sf = Math.min(1, speed / 0.6);
      for (let i = 0; i < grains.length; i++) {
        const g = grains[i];
        const dx = g.x - cx, dy = g.y - cy;
        const dist = Math.hypot(dx, dy);
        if (dist > SHOVE_RADIUS) continue;
        const t = 1 - dist / SHOVE_RADIUS;
        const f = SHOVE_STRENGTH * t * t * sf;
        g.vx += dirX * f;
        g.vy += dirY * f;
      }
    }

    // ── invert button ─────────────────────────────────────────────
    const invertBtn = document.getElementById("nf-invert");
    if (invertBtn) {
      invertBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        targetPolarity = -targetPolarity;
        document.body.classList.toggle("nf-inverted", targetPolarity < 0);
        document.dispatchEvent(new Event("nfinvert"));
      });
      invertBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
      invertBtn.addEventListener("pointerup",   (e) => e.stopPropagation());
    }

    document.addEventListener("pointermove", (e) => {
      if (e.target.closest && e.target.closest(
        "#nf-invert, #nf-home, .ow-tile, #ps-tile, .ic-tile, " +
        ".ow-stage, #ps-stage, .ic-stage"
      )) return;
      const now = performance.now();
      const dt  = source.active ? Math.max(1, now - source.lastMoveTs) : 16;
      const vx  = (e.clientX - source.x) / dt;
      const vy  = (e.clientY - source.y) / dt;
      const spd = Math.hypot(vx, vy);
      if (source.active) applyShove(e.clientX, e.clientY, vx, vy, spd);
      source.x = e.clientX; source.y = e.clientY; source.lastMoveTs = now; source.active = true;
    });
    document.addEventListener("pointerleave", () => {
      if (source.active) { applyKick(source.x, source.y); source.active = false; }
      if (source.pressed) { applyDisperse(source.x, source.y); source.pressed = false; }
    });
    document.addEventListener("pointerdown", (e) => {
      if (e.target.closest && e.target.closest(
        "#nf-invert, #nf-home, .ow-tile, #ps-tile, .ic-tile, " +
        ".ow-stage, #ps-stage, .ic-stage"
      )) return;
      source.pressed = true;
      source.x = e.clientX; source.y = e.clientY;
      source.active = true;
      applyKick(e.clientX, e.clientY);
    });
    document.addEventListener("pointerup", (e) => {
      if (source.pressed) {
        applyDisperse(e.clientX, e.clientY);
        source.pressed = false;
      }
    });
    document.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0) {
        const now = performance.now();
        const tx = e.touches[0].clientX, ty = e.touches[0].clientY;
        const dt = source.active ? Math.max(1, now - source.lastMoveTs) : 16;
        const vx = (tx - source.x) / dt, vy = (ty - source.y) / dt;
        const spd = Math.hypot(vx, vy);
        if (source.active) applyShove(tx, ty, vx, vy, spd);
        source.x = tx; source.y = ty; source.lastMoveTs = now; source.active = true;
      }
    }, { passive: true });
    document.addEventListener("touchend", (e) => {
      if (source.pressed) {
        const t = e.changedTouches[0];
        applyDisperse(t.clientX, t.clientY);
        source.pressed = false;
      }
      if (source.active) { applyKick(source.x, source.y); source.active = false; }
    });

    // Reset source tracking whenever a stage opens so the field
    // doesn't inherit stale velocity state when it resumes.
    document.addEventListener("stageopen", () => {
      source.active  = false;
      source.pressed = false;
    });

    // ── stage-occlusion check ─────────────────────────────────────
    function anyStageOpen() {
      return !!document.querySelector(".ow-stage.open, .ic-stage.open, #ps-stage.open");
    }

    // ── render loop ───────────────────────────────────────────────
    // PIXEL BUFFER approach:
    //   1. Fill imgData with paper color (one memset-equivalent pass)
    //   2. For each grain, blend the 3 channel colors into nearby pixels
    //      using multiply compositing done in JS.
    //   This replaces the previous 3×N arc() calls with 1×N pixel writes.
    //
    // Multiply composite:  out = (src/255) × dst
    // Screen composite:    out = 1 - (1-src/255) × (1-dst/255)
    // Both computed inline to avoid function-call overhead.

    let lastTs = 0;

    function frame(ts) {
      // Wait until setupCanvas has succeeded at least once.
      if (!ready) { requestAnimationFrame(frame); return; }

      const dt = lastTs ? Math.min(50, ts - lastTs) : 16;
      lastTs = ts;

      if (anyStageOpen()) { requestAnimationFrame(frame); return; }

      // Smooth polarity
      polarity += (targetPolarity - polarity) * INVERSION_LERP;

      // ── physics ──
      for (let i = 0; i < grains.length; i++) {
        const g = grains[i];
        let fx = 0, fy = 0;

        if (source.active) {
          const dx = source.x - g.x, dy = source.y - g.y;
          const dist = Math.hypot(dx, dy);

          if (source.pressed) {
            // Hold: strong continuous gather toward cursor
            if (dist > 0.5 && dist < GATHER_RADIUS) {
              const t = 1 - dist / GATHER_RADIUS;
              const f = GATHER_STRENGTH * t * t * polarity;
              fx += (dx / dist) * f;
              fy += (dy / dist) * f;
            }
          } else {
            // Hover: gentle passive attract (original behaviour)
            if (dist > 0.5 && dist < ATTRACT_RADIUS) {
              const t = 1 - dist / ATTRACT_RADIUS;
              const f = ATTRACT_STRENGTH * t * t * polarity;
              fx += (dx / dist) * f;
              fy += (dy / dist) * f;
            }
          }
        }

        fx += (g.rx - g.x) * SETTLE_RATE;
        fy += (g.ry - g.y) * SETTLE_RATE;
        g.vx = (g.vx + fx) * VELOCITY_DAMPING;
        g.vy = (g.vy + fy) * VELOCITY_DAMPING;
        g.x += g.vx; g.y += g.vy;
        const odx = g.x - g.rx, ody = g.y - g.ry;
        const od  = Math.hypot(odx, ody);
        // Allow wider displacement while pressed so grains visibly gather
        const maxD = source.pressed ? MAX_DISPLACEMENT * 3 : MAX_DISPLACEMENT;
        if (od > maxD) {
          const k = maxD / od;
          g.x = g.rx + odx * k; g.y = g.ry + ody * k;
        }
      }

      // ── paper color ──
      const tInv = (1 - polarity) / 2;
      const pr = (PAPER_LIGHT[0] + (PAPER_DARK[0] - PAPER_LIGHT[0]) * tInv) | 0;
      const pg = (PAPER_LIGHT[1] + (PAPER_DARK[1] - PAPER_LIGHT[1]) * tInv) | 0;
      const pb = (PAPER_LIGHT[2] + (PAPER_DARK[2] - PAPER_LIGHT[2]) * tInv) | 0;

      // ── fill ImageData with paper color ──
      const buf = imgData.data;
      const pw  = canvas.width;
      const ph  = canvas.height;
      const total4 = pw * ph * 4;
      for (let i = 0; i < total4; i += 4) {
        buf[i]   = pr;
        buf[i+1] = pg;
        buf[i+2] = pb;
        buf[i+3] = 255;
      }

      // ── fixed grain size (breath oscillation removed) ──
      const halfInt = Math.max(1, (GRAIN_HALF * dpr) | 0);

      // ── choose blend mode based on polarity ──
      const useMultiply = polarity >= 0;

      // ── paint grains into pixel buffer ──
      // For each grain, compute a square footprint in physical pixels,
      // then blend each of the 3 channel colors into those pixels.
      // Multiply: out = (src * dst) / 255
      // Screen:   out = src + dst - (src * dst) / 255
      for (let gi = 0; gi < grains.length; gi++) {
        const g  = grains[gi];
        const gx = (g.x * dpr) | 0;
        const gy = (g.y * dpr) | 0;
        const x0 = Math.max(0, gx - halfInt);
        const x1 = Math.min(pw - 1, gx + halfInt);
        const y0 = Math.max(0, gy - halfInt);
        const y1 = Math.min(ph - 1, gy + halfInt);

        for (let ch = 0; ch < 3; ch++) {
          const cr = CHANNELS[ch][0];
          const cg = CHANNELS[ch][1];
          const cb = CHANNELS[ch][2];

          for (let py = y0; py <= y1; py++) {
            const rowBase = py * pw * 4;
            for (let px = x0; px <= x1; px++) {
              const idx = rowBase + px * 4;
              if (useMultiply) {
                buf[idx]   = (cr * buf[idx])   >> 8;
                buf[idx+1] = (cg * buf[idx+1]) >> 8;
                buf[idx+2] = (cb * buf[idx+2]) >> 8;
              } else {
                // screen
                const dr = buf[idx], dg = buf[idx+1], db = buf[idx+2];
                buf[idx]   = cr + dr - ((cr * dr) >> 8);
                buf[idx+1] = cg + dg - ((cg * dg) >> 8);
                buf[idx+2] = cb + db - ((cb * db) >> 8);
              }
            }
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
})();
</script>

<!-- ═══════════════════════════════════════════════════════════════
     OUTWARD  —  optimized SVG element pooling
     ═══════════════════════════════════════════════════════════════
     Key change: instead of removeChild/appendChild every frame for
     asteroids, shots, and depth rings, we maintain a pool of
     pre-created SVG elements and update only their attributes.
     Elements beyond the current count are hidden (display:none).
     This eliminates GC pressure from DOM node churn.
     ═══════════════════════════════════════════════════════════════ -->
<script>
(function () {
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  function init() {
    const VB_W = 1000, VB_H = 700;
    const CX = 500, CY = 350;
    const TUNNEL_R = 240;
    const FOCAL = 380;
    const NEAR_Z = 0;
    const FAR_Z  = 1400;
    const SHIP_RIM_R = 180;
    const SHIP_HIT_R = 18;
    const ASTEROID_BASE_R = 20;
    const ASTEROID_BASE_R_VAR = 5;
    const FWD_SPEED_START = 0.25;
    const FWD_SPEED_END   = 1.10;
    const LEVEL_ACCEL_MS  = 28000;
    const SHOT_INWARD_SPEED = 2.6;
    const SHOT_FIRE_COOLDOWN = 180;
    const KEY_STEER_SPEED = 0.0028;
    const DEPTH_RING_COUNT  = 6;
    const DEPTH_RING_SPACE  = 220;
    const WARP_MAX_OFFSET = 26;
    const WARP_EASE_RATE  = 0.0055;
    const PORTAL_PULSE_HZ   = 1 / 3.2;
    const PORTAL_PULSE_AMP  = 0.06;
    const RIPPLE_DURATION   = 700;
    const RIPPLE_AMPLITUDE  = 24;
    const KILL_FLASH_MS     = 220;
    const COLLAPSE_MS       = 750;
    const LEVELS = [1, 1, 2, 3, 5, 8, 13, 21];
    const SVG_NS = "http://www.w3.org/2000/svg";

    const svg        = document.getElementById("ow-svg");
    const ship       = document.getElementById("ow-ship");
    const asteroidsG = document.getElementById("ow-asteroids");
    const shotsG     = document.getElementById("ow-shots");
    const depthRingsG= document.getElementById("ow-depth-rings");
    const portal     = document.getElementById("ow-portal");
    const levelEl    = document.getElementById("ow-level");
    const banner     = document.getElementById("ow-banner");
    const bannerTitle= document.getElementById("ow-banner-title");
    const bannerSub  = document.getElementById("ow-banner-sub");
    const bannerBtn  = document.getElementById("ow-banner-btn");

    // ── SVG element pools ─────────────────────────────────────────
    // Pre-create elements; show/hide rather than add/remove.
    // Pools are grown lazily when count exceeds current size.
    const astPool   = [];  // { el: <circle> }
    const shotPool  = [];
    const ringPool  = [];
    // portal is two elements (arc path + tick line) — kept as before
    // since it's only 2 nodes and uses a path string.
    let portalArc  = null;
    let portalTick = null;

    function getOrCreate(pool, group, tag, attrs) {
      // Return next available element from the pool, or create one.
      // We track usage via a cursor that resets each frame.
      const el = document.createElementNS(SVG_NS, tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      group.appendChild(el);
      return el;
    }

    const getInk = () => document.body.classList.contains('nf-inverted') ? '#e6e5e0' : '#1a1a1a';

    // Re-colour all pooled SVG elements when the page inverts
    document.addEventListener('nfinvert', () => {
      const ink = getInk();
      astPool.forEach(el  => el.setAttribute('stroke', ink));
      shotPool.forEach(el => el.setAttribute('fill',   ink));
      ringPool.forEach(el => el.setAttribute('stroke', ink));
      if (portalArc)  portalArc.setAttribute('stroke',  ink);
      if (portalTick) portalTick.setAttribute('stroke', ink);
    });    function ensurePool(pool, group, count, tag, baseAttrs) {
      while (pool.length < count) {
        const el = document.createElementNS(SVG_NS, tag);
        for (const [k, v] of Object.entries(baseAttrs)) el.setAttribute(k, v);
        el.setAttribute("display", "none");
        group.appendChild(el);
        pool.push(el);
      }
    }

    // Pre-warm pools to avoid initial frame allocation spikes.
    ensurePool(astPool,  asteroidsG, 25, "circle", { fill:"none", stroke:getInk(), "stroke-width":"1" });
    ensurePool(shotPool, shotsG,     10, "circle", { fill:getInk() });
    ensurePool(ringPool, depthRingsG, DEPTH_RING_COUNT + 2, "circle", {
      fill: "none", stroke: getInk(), "stroke-width": "0.5",
      "stroke-dasharray": "3 8"
    });

    // Pre-create portal elements.
    portalArc  = document.createElementNS(SVG_NS, "path");
    portalArc.setAttribute("fill", "none");
    portalArc.setAttribute("stroke", getInk());
    portalArc.setAttribute("stroke-linecap", "round");
    portal.appendChild(portalArc);

    portalTick = document.createElementNS(SVG_NS, "line");
    portalTick.setAttribute("stroke", getInk());
    portalTick.setAttribute("stroke-linecap", "round");
    portal.appendChild(portalTick);

    // ── game state ────────────────────────────────────────────────
    let gameState = "idle";
    let levelIdx  = 0;
    let stageOpen = false;
    let bestLevel = parseInt(localStorage.getItem("ow-best-level") || "0", 10);
    let warpX = 0, warpY = 0, warpTargetX = 0, warpTargetY = 0;
    let ripples = [];
    let lastKillTs = 0;
    let collapse = null;
    let deepestZReached = 0;
    let shipAngle = Math.PI / 2;
    let asteroids = [], shots = [];
    let nextAstId = 0, nextShotId = 0;
    let levelElapsed = 0;
    let portalArrived = false;
    let depthRings = [];
    for (let i = 0; i < DEPTH_RING_COUNT; i++) depthRings.push(200 + i * DEPTH_RING_SPACE);
    let lastTs = 0, lastFireTs = 0;
    // Cursor angle: updated continuously from pointermove over the SVG.
    // The ship's angle snaps to wherever the cursor points relative to
    // the tunnel center — no separate joystick zone needed.
    let cursorAngle = Math.PI / 2;   // start at bottom (matches shipAngle default)
    let cursorOnSvg = false;         // true while pointer is inside the SVG
    const keys = { left:false, right:false };

    // Map a client-space pointer position to an angle around the tunnel center.
    function clientToAngle(clientX, clientY) {
      const rect = svg.getBoundingClientRect();
      const sc   = Math.min(rect.width / VB_W, rect.height / VB_H);
      const ox   = (rect.width  - VB_W * sc) / 2;
      const oy   = (rect.height - VB_H * sc) / 2;
      const vx   = (clientX - rect.left - ox) / sc;
      const vy   = (clientY - rect.top  - oy) / sc;
      return Math.atan2(vy - CY, vx - CX);
    }

    // ── SVG pointer handlers: steer + fire on the same surface ────
    svg.addEventListener("pointermove", (e) => {
      cursorOnSvg = true;
      cursorAngle = clientToAngle(e.clientX, e.clientY);
      if (gameState === "playing") shipAngle = cursorAngle;
    });
    svg.addEventListener("pointerleave", () => { cursorOnSvg = false; });
    svg.addEventListener("pointerenter", (e) => {
      cursorOnSvg = true;
      cursorAngle = clientToAngle(e.clientX, e.clientY);
    });
    // Click/tap anywhere on SVG: fire when playing, start when idle/crashed
    svg.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      cursorAngle = clientToAngle(e.clientX, e.clientY);
      if (gameState === "playing") {
        shipAngle = cursorAngle;
        tryFire();
      } else {
        handleSpaceOrFire();
      }
    });

    function project(x, y, z) {
      const scale = FOCAL / (FOCAL + Math.max(z, 0.1));
      const wf = 1 - scale;
      return {
        sx: (CX + warpX * wf) + (x - CX) * scale,
        sy: (CY + warpY * wf) + (y - CY) * scale,
        scale,
      };
    }

    // Arrow keys: left/right only (up/down removed — cursor controls angle now).
    document.addEventListener("keydown", (e) => {
      if (!stageOpen) return;
      if (e.repeat) {
        if (e.code === "Space" && gameState === "playing") { tryFire(); e.preventDefault(); }
        return;
      }
      switch (e.code) {
        case "ArrowLeft":case "KeyA": keys.left  = true; e.preventDefault(); break;
        case "ArrowRight":case "KeyD":keys.right = true; e.preventDefault(); break;
        case "Space":    handleSpaceOrFire(); e.preventDefault(); break;
        case "Escape":   closeStage(); break;
      }
    });
    document.addEventListener("keyup", (e) => {
      if (!stageOpen) return;
      switch (e.code) {
        case "ArrowLeft":case "KeyA": keys.left  = false; break;
        case "ArrowRight":case "KeyD":keys.right = false; break;
      }
    });

    function tryFire() {
      if (gameState !== "playing") return;
      const now = performance.now();
      if (now - lastFireTs < SHOT_FIRE_COOLDOWN) return;
      lastFireTs = now;
      const sx = CX + SHIP_RIM_R * Math.cos(shipAngle);
      const sy = CY + SHIP_RIM_R * Math.sin(shipAngle);
      shots.push({ id: nextShotId++, x: sx, y: sy, z: 0, vz: SHOT_INWARD_SPEED });
      ripples.push({ t0: now });
    }

    function handleSpaceOrFire() {
      switch (gameState) {
        case "idle":    startGame();                        break;
        case "playing": tryFire();                          break;
        case "crashed": restartLevel();                     break;
        case "won":     levelIdx = 0; startGame();          break;
      }
    }

    function spawnLevel(count) {
      asteroids = []; shots = []; portalArrived = false; levelElapsed = 0;
      const zSpacing = FAR_Z / Math.max(count, 2);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const rimR  = SHIP_RIM_R * (0.65 + Math.random() * 0.5);
        asteroids.push({
          id: nextAstId++,
          x: CX + rimR * Math.cos(angle), y: CY + rimR * Math.sin(angle),
          z: (i+1) * zSpacing + (Math.random()-0.5) * zSpacing * 0.5,
          r: ASTEROID_BASE_R + (Math.random()*2-1) * ASTEROID_BASE_R_VAR,
          alive: true,
        });
      }
    }

    function currentFwdSpeed() {
      const t = Math.min(1, levelElapsed / LEVEL_ACCEL_MS);
      return FWD_SPEED_START + (FWD_SPEED_END - FWD_SPEED_START) * t * t;
    }

    // ── pooled render helpers ─────────────────────────────────────
    function renderShip() {
      const sx = CX + SHIP_RIM_R * Math.cos(shipAngle);
      const sy = CY + SHIP_RIM_R * Math.sin(shipAngle);
      const da = Math.atan2(CY - sy, CX - sx) * 180 / Math.PI + 90;
      ship.setAttribute("transform", `translate(${sx} ${sy}) rotate(${da})`);
    }

    function renderAsteroids() {
      ensurePool(astPool, asteroidsG, asteroids.length,
        "circle", { fill:"none", stroke:getInk(), "stroke-width":"1" });
      let idx = 0;
      for (const a of asteroids) {
        if (!a.alive || a.z < -50) continue;
        const p = project(a.x, a.y, a.z);
        const r = a.r * p.scale;
        if (r < 0.6) continue;
        const el = astPool[idx++];
        el.setAttribute("cx", p.sx.toFixed(1));
        el.setAttribute("cy", p.sy.toFixed(1));
        el.setAttribute("r",  r.toFixed(1));
        el.setAttribute("stroke-width", (1.2 * Math.max(0.4, p.scale)).toFixed(2));
        // Depth opacity: faint when far, full when close
        const depthT = Math.max(0, Math.min(1, 1 - a.z / FAR_Z));
        el.setAttribute("opacity", (0.15 + 0.85 * depthT * depthT).toFixed(3));
        el.removeAttribute("display");
      }
      // Hide unused pool elements
      for (let i = idx; i < astPool.length; i++) astPool[i].setAttribute("display","none");
    }

    function renderShots() {
      ensurePool(shotPool, shotsG, shots.length, "circle", { fill:getInk() });
      let idx = 0;
      for (const s of shots) {
        const p = project(s.x, s.y, s.z);
        const r = 3 * p.scale;
        if (r < 0.4) continue;
        const el = shotPool[idx++];
        el.setAttribute("cx", p.sx.toFixed(1));
        el.setAttribute("cy", p.sy.toFixed(1));
        el.setAttribute("r",  r.toFixed(1));
        el.removeAttribute("display");
      }
      for (let i = idx; i < shotPool.length; i++) shotPool[i].setAttribute("display","none");
    }

    function renderDepthRings() {
      const now = performance.now();
      ripples = ripples.filter(r => now - r.t0 < RIPPLE_DURATION);
      let collapseFactor = 0;
      if (gameState === "crashing" && collapse) {
        collapseFactor = Math.min(1, (now - collapse.startTs) / COLLAPSE_MS);
        collapseFactor = collapseFactor * collapseFactor;
      }
      ensurePool(ringPool, depthRingsG, depthRings.length,
        "circle", { fill:"none", stroke:getInk(), "stroke-width":"0.5", "stroke-dasharray":"3 8" });

      for (let ri = 0; ri < depthRings.length; ri++) {
        let dz = depthRings[ri];
        if (collapseFactor > 0) dz = dz * (1 - collapseFactor * 0.95);
        if (dz < 0) { ringPool[ri].setAttribute("display","none"); continue; }
        const p = project(CX, CY, dz);

        let ripplePert = 0;
        for (const ripple of ripples) {
          const age = (now - ripple.t0) / RIPPLE_DURATION;
          const waveZ = FAR_Z * (1 - age);
          const dfw = Math.abs(dz - waveZ);
          const falloff = Math.max(0, 1 - dfw / 200);
          ripplePert += falloff * Math.sin(Math.PI * age) * RIPPLE_AMPLITUDE;
        }

        const r = (TUNNEL_R + ripplePert) * p.scale;
        if (r < 6) { ringPool[ri].setAttribute("display","none"); continue; }
        const baseOp = 0.18 * p.scale;
        const op = collapseFactor > 0 ? baseOp * (1 - collapseFactor) : baseOp;
        const el = ringPool[ri];
        el.setAttribute("cx", p.sx.toFixed(1));
        el.setAttribute("cy", p.sy.toFixed(1));
        el.setAttribute("r",  r.toFixed(1));
        el.setAttribute("opacity", op.toFixed(3));
        el.removeAttribute("display");
      }
    }

    function renderPortal() {
      const now = performance.now();
      const allClear = asteroids.length > 0 && asteroids.every(a => !a.alive);

      let portalZ;
      if (portalArrived) portalZ = 0;
      else {
        const aliveZs = asteroids.filter(a => a.alive).map(a => a.z);
        portalZ = Math.max(aliveZs.length ? Math.max(...aliveZs) + 250 : 250, 120);
      }
      const p   = project(CX, CY, portalZ);

      // When all clear: portal pulses faster and more deeply as a destination cue.
      const pulseHz  = allClear ? PORTAL_PULSE_HZ * 3   : PORTAL_PULSE_HZ;
      const pulseAmp = allClear ? PORTAL_PULSE_AMP * 3  : PORTAL_PULSE_AMP;
      const pls = 1 + Math.sin(now * 2 * Math.PI * pulseHz) * pulseAmp;
      let r = Math.max(60 * p.scale * pls, 4);

      const sk = now - lastKillTs;
      const flash = Math.max(0, 1 - sk / KILL_FLASH_MS);
      if (gameState === "crashing" && collapse) {
        const age = Math.min(1, (now - collapse.startTs) / COLLAPSE_MS);
        r *= 1 + age * 1.4;
      }

      // Stroke weight: thin when dormant, heavier when active destination.
      const sw = portalArrived ? 2.5 : allClear ? 2.2 : 1.4;
      const ghalf = 0.32;
      const sa = -Math.PI/2 + ghalf, ea = -Math.PI/2 - ghalf + Math.PI*2;
      const x1 = p.sx + r * Math.cos(sa), y1 = p.sy + r * Math.sin(sa);
      const x2 = p.sx + r * Math.cos(ea), y2 = p.sy + r * Math.sin(ea);
      portalArc.setAttribute("d", `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r.toFixed(1)} ${r.toFixed(1)} 0 1 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`);
      portalArc.setAttribute("stroke-width", sw.toFixed(2));
      if (r > 10) {
        const ti = r - r * 0.18, to = r + r * 0.06;
        portalTick.setAttribute("x1", p.sx.toFixed(1)); portalTick.setAttribute("y1", (p.sy - ti).toFixed(1));
        portalTick.setAttribute("x2", p.sx.toFixed(1)); portalTick.setAttribute("y2", (p.sy - to).toFixed(1));
        portalTick.setAttribute("stroke-width", sw.toFixed(2));
        portalTick.removeAttribute("display");
      } else { portalTick.setAttribute("display","none"); }

      // Opacity: faint during combat, full when clear, flash on kill.
      const baseOp = portalArrived ? 1 : allClear ? 1 : 0.35;
      portal.setAttribute("opacity", Math.min(1, baseOp + flash * 0.4).toFixed(3));
    }

    function updateHUD() {
      levelEl.textContent = levelIdx + 1;
      // Render remaining asteroids as pip dots — glanceable without reading a number.
      const pipsEl = document.getElementById("ow-pips");
      if (pipsEl) {
        const alive = asteroids.filter(a => a.alive).length;
        // Rebuild only when count changes to avoid thrashing the DOM every frame.
        if (parseInt(pipsEl.dataset.count || "-1") !== alive) {
          pipsEl.dataset.count = alive;
          pipsEl.innerHTML = "";
          for (let i = 0; i < alive; i++) {
            const dot = document.createElement("span");
            dot.className = "ow-pip";
            pipsEl.appendChild(dot);
          }
        }
      }
    }

    // ── game loop ─────────────────────────────────────────────────
    function tick(ts) {
      if (!lastTs) lastTs = ts;
      const dt = ts - lastTs; lastTs = ts;

      if (gameState === "crashing" && collapse) {
        if (performance.now() - collapse.startTs >= COLLAPSE_MS) finishCrash();
      }

      if (gameState === "playing") {
        levelElapsed += dt;
        const dz = currentFwdSpeed() * dt;
        deepestZReached += dz;
        for (const a of asteroids) a.z -= dz;
        for (let i = 0; i < depthRings.length; i++) {
          depthRings[i] -= dz;
          if (depthRings[i] < 0) depthRings[i] = Math.max(...depthRings) + DEPTH_RING_SPACE;
        }

        // Steering: cursor position drives ship angle directly.
        // Arrow keys rotate when cursor isn't on the SVG (keyboard fallback).
        if (cursorOnSvg) {
          shipAngle = cursorAngle;
        } else {
          let dAngle = 0;
          if (keys.left)  dAngle -= 1;
          if (keys.right) dAngle += 1;
          shipAngle += dAngle * KEY_STEER_SPEED * dt;
        }

        warpTargetX = -Math.cos(shipAngle) * WARP_MAX_OFFSET;
        warpTargetY = -Math.sin(shipAngle) * WARP_MAX_OFFSET;
        const ease = 1 - Math.exp(-WARP_EASE_RATE * dt);
        warpX += (warpTargetX - warpX) * ease;
        warpY += (warpTargetY - warpY) * ease;

        shots = shots.filter(s => {
          s.z += s.vz * dt;
          if (s.z > FAR_Z + 100) return false;
          for (const a of asteroids) {
            if (!a.alive || Math.abs(a.z - s.z) > 60) continue;
            const pa = project(a.x, a.y, a.z), ps = project(s.x, s.y, s.z);
            const dx = pa.sx - ps.sx, dy = pa.sy - ps.sy;
            if (Math.hypot(dx,dy) < a.r * pa.scale + 4) {
              a.alive = false;
              lastKillTs = performance.now();
              ripples.push({ t0: lastKillTs });
              return false;
            }
          }
          return true;
        });

        const sX = CX + SHIP_RIM_R * Math.cos(shipAngle);
        const sY = CY + SHIP_RIM_R * Math.sin(shipAngle);
        for (const a of asteroids) {
          if (!a.alive) continue;
          if (a.z > 40) continue;
          if (a.z < -60) { a.alive = false; continue; }
          const pa = project(a.x, a.y, Math.max(a.z,0));
          if (Math.hypot(pa.sx - sX, pa.sy - sY) < a.r * pa.scale + SHIP_HIT_R) {
            return beginCrash(shipAngle, asteroids.filter(x => x.alive).length);
          }
        }

        if (asteroids.filter(a => a.alive).length === 0 && !portalArrived) {
          portalArrived = true;
          setTimeout(() => { if (gameState === "playing") advanceLevel(); }, 700);
        }
      }

      renderShip();
      renderDepthRings();
      renderAsteroids();
      renderShots();
      renderPortal();
      updateHUD();
      requestAnimationFrame(tick);
    }

    function startGame() {
      hideBanner(); gameState = "playing"; levelIdx = 0;
      shipAngle = Math.PI/2; deepestZReached = 0; ripples = [];
      warpX = warpY = warpTargetX = warpTargetY = 0; lastTs = 0;
      spawnLevel(LEVELS[levelIdx]);
    }
    function beginCrash(impactAngle, remaining) {
      gameState = "crashing";
      collapse = { startTs: performance.now(), impactAngle, remaining, levelAtCrash: levelIdx };
    }
    function finishCrash() {
      gameState = "crashed";
      const c = collapse || { remaining:0, levelAtCrash:0 };
      const total = LEVELS[c.levelAtCrash];
      const cleared = total - c.remaining;
      if (c.levelAtCrash > bestLevel) {
        bestLevel = c.levelAtCrash;
        try { localStorage.setItem("ow-best-level", String(bestLevel)); } catch(_){}
      }
      // Win: you lost, show what was cleared and offer retry
      const sub = cleared === total
        ? `level ${c.levelAtCrash + 1} · all cleared — hit on approach`
        : `level ${c.levelAtCrash + 1} · ${cleared} of ${total} cleared`;
      showBanner("collision", sub, "try again", () => restartLevel());
      collapse = null;
    }
    function restartLevel() {
      hideBanner(); gameState = "playing"; shipAngle = Math.PI/2;
      deepestZReached = 0; ripples = [];
      warpX = warpY = warpTargetX = warpTargetY = 0; lastTs = 0;
      spawnLevel(LEVELS[levelIdx]);
    }
    function advanceLevel() {
      if (levelIdx >= bestLevel) {
        bestLevel = Math.min(LEVELS.length - 1, levelIdx + 1);
        try { localStorage.setItem("ow-best-level", String(bestLevel)); } catch(_){}
      }
      levelIdx++;
      if (levelIdx >= LEVELS.length) {
        gameState = "won"; bestLevel = LEVELS.length;
        try { localStorage.setItem("ow-best-level", String(bestLevel)); } catch(_){}
        showBanner("outward reached", "all eight levels cleared", "play again", () => { levelIdx = 0; restartLevel(); });
        return;
      }
      // Show a brief level-clear banner, then auto-advance after 1.6s
      // so the player sees what's coming without needing to click.
      gameState = "idle";
      const nextCount = LEVELS[levelIdx];
      showBanner(
        `level ${levelIdx + 1}`,
        `${nextCount} ${nextCount === 1 ? "obstacle" : "obstacles"} ahead`,
        "continue",
        () => { hideBanner(); gameState = "playing"; shipAngle = Math.PI/2; ripples = []; warpX = warpY = 0; lastTs = 0; spawnLevel(LEVELS[levelIdx]); }
      );
      // Auto-dismiss after 1.6s if player doesn't click
      setTimeout(() => {
        if (gameState === "idle" && stageOpen) {
          hideBanner(); gameState = "playing"; shipAngle = Math.PI/2;
          ripples = []; warpX = warpY = 0; lastTs = 0;
          spawnLevel(LEVELS[levelIdx]);
        }
      }, 1600);
    }

    function showBanner(title, sub, btnLabel, btnAction) {
      bannerTitle.textContent = title; bannerSub.textContent = sub;
      bannerBtn.textContent = btnLabel; bannerBtn.onclick = btnAction;
      banner.classList.add("show");
    }
    function hideBanner() { banner.classList.remove("show"); }

    const tile  = document.getElementById("ow-tile");
    const stage = document.getElementById("ow-stage");

    function openStage() {
      if (stageOpen) return;
      stageOpen = true;
      stage.classList.add("open");

      // Resume seamlessly if a game is already running or just crashed.
      // Only show the welcome banner on a genuinely fresh open.
      if (gameState === "playing" || gameState === "crashing") {
        // Already mid-game — just reveal the stage, game continues.
        return;
      }
      if (gameState === "crashed") {
        // Show the crash result again so the player can restart.
        // (banner is already showing from finishCrash)
        return;
      }

      // Fresh open or post-win: reset and show welcome.
      levelIdx = 0; ripples = [];
      warpX = warpY = warpTargetX = warpTargetY = 0;
      shipAngle = Math.PI/2; lastTs = 0;
      spawnLevel(LEVELS[0]);
      const bestStr = bestLevel >= LEVELS.length
        ? "complete · play again?"
        : bestLevel > 0
          ? `reached level ${bestLevel + 1} last time`
          : "clear the tunnel · reach the portal";
      showBanner(
        "outward",
        bestStr,
        "begin",
        () => startGame()
      );
    }

    function closeStage() {
      if (!stageOpen) return;
      stageOpen = false;
      stage.classList.remove("open");
      // Do NOT reset gameState — preserve it so reopening resumes.
      keys.left = keys.right = false;
      cursorOnSvg = false;
    }

    // Mobile fire button
    const fireBtnEl = document.getElementById('ow-fire-btn');
    if (fireBtnEl) {
      fireBtnEl.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        handleSpaceOrFire();
      });
    }

    tile.addEventListener("click", openStage);
    const SAFE_RADIUS_OW = 440;
    stage.addEventListener("click", (e) => {
      if (banner.classList.contains("show") && banner.contains(e.target)) return;
      const svgEl = document.getElementById("ow-svg");
      if (!svgEl) return;
      const rect = svgEl.getBoundingClientRect();
      const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
      const ppu = rect.width / 1000;
      if (Math.hypot((e.clientX-cx)/ppu, (e.clientY-cy)/ppu) > SAFE_RADIUS_OW) closeStage();
    });

    let owScrollTimer = null;
    window.addEventListener("scroll", () => {
      if (!stageOpen) return;
      if (owScrollTimer) clearTimeout(owScrollTimer);
      owScrollTimer = setTimeout(() => {
        const rect = tile.getBoundingClientRect();
        if (rect.bottom < 0 || rect.top > window.innerHeight) closeStage();
      }, 80);
    }, { passive: true });

    requestAnimationFrame(tick);
  }  // end init
})();
</script>

<script>
(function () {
  const φ   = (1 + Math.sqrt(5)) / 2;
  const SQ3 = Math.sqrt(3);

  function mkS(name, eq, F, V, E, verts, tris, edges, hue, hd) {
    return { name, eq, F, V, E, verts, tris, edges, hue, hueDark: hd };
  }
  const SOLIDS = [

    tileX.save();tileX.strokeStyle=`rgb(${cA[0]},${cA[1]},${cA[2]})`;tileX.globalAlpha=(1-t)*0.55;tileX.lineWidth=1.0;

    if(tileMorphing){const vs2=normVerts(SOLIDS[tileNextIdx]);const rot2=vs2.map(v=>{let q=rY(v,tileAngle*0.72);q=rX(q,tileAngle*0.44);return q;});tileX.globalAlpha=t*0.55;tileX.strokeStyle=`rgb(${cB[0]},${cB[1]},${cB[2]})`;SOLIDS[tileNextIdx].edges.forEach(e=>{const a=rot2[e[0]],b=rot2[e[1]];const pa=prj(a[0],a[1],a[2],cx,cy,sc),pb=prj(b[0],b[1],b[2],cx,cy,sc);tileX.beginPath();tileX.moveTo(pa[0],pa[1]);tileX.lineTo(pb[0],pb[1]);tileX.stroke();});}

    for(const{i}of ord){const[a,b,cc]=rotP[i];const pa=prj(a[0],a[1],a[2],cx,cy,sc),pb=prj(b[0],b[1],b[2],cx,cy,sc),pc=prj(cc[0],cc[1],cc[2],cx,cy,sc);const n=nrm(cross(sub(b,a),sub(cc,a)));const shade=dot(n,LIGHT)*0.5+0.5;const tc=cA.map((x,j)=>lerp(x,cB[j],t)|0);tileX.beginPath();tileX.moveTo(pa[0],pa[1]);tileX.lineTo(pb[0],pb[1]);tileX.lineTo(pc[0],pc[1]);tileX.closePath();tileX.fillStyle=`rgba(${tc[0]},${tc[1]},${tc[2]},${(0.14+shade*0.42).toFixed(3)})`;tileX.fill();tileX.strokeStyle=`rgba(${tc[0]},${tc[1]},${tc[2]},.75)`;tileX.lineWidth=1.0;tileX.stroke();}

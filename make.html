<!--
  Word Ring — game prototype v2.
  • Click the tile to expand the playfield.
  • Tap (or press SPACE) the word at center to launch it.
  • Land on empty arc → tether outward. Land on existing word → it pushes
    out, your new word takes the inner spot (stack capped at 2).
  • Hit an inward DIP on the ring → the word falls quietly into it and the
    sentence you built is revealed.
-->

<style>

  #ic-root, #ic-root * { box-sizing: border-box; }

    padding: 40px 0;
    font-family: var(--ic-serif);
    color: var(--ic-ink);

  /* 2×2 grid of tiles */
  .ic-grid {
    display: grid;
    grid-template-columns: repeat(2, 220px);
    gap: 40px;
    justify-content: center;
  }

  /* a single tile (collapsed state — matches game-tile dimensions) */
  .ic-tile {
    width: 220px; height: 220px;

  /* ── overlay stage (shared by all four cards) ── */

<style>

<script>
(function () {
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  function init() {
    const root  = document.getElementById("ic-root");
    const stage = document.getElementById("ic-stage");
    const card  = document.getElementById("ic-card");
    const tiles = Array.from(root.querySelectorAll(".ic-tile"));

    // content holders inside the stage
    const elEyebrow = document.getElementById("ic-eyebrow");
    const elTitle   = document.getElementById("ic-title");
    const elSub     = document.getElementById("ic-sub");
    const elBody    = document.getElementById("ic-body");
    const elImage   = document.getElementById("ic-image");

    let stageOpen = false;

    function hydrate(tile) {
      const d = tile.dataset;
      elEyebrow.textContent = d.eyebrow || "";
      elTitle.textContent   = d.title   || "";
      elSub.textContent     = d.sub     || "";
      elBody.textContent    = d.body    || "";
      if (d.image && d.image.trim() !== "") {
        elImage.src = d.image;
        elImage.style.display = "block";
      } else {
        elImage.removeAttribute("src");
        elImage.style.display = "none";
      }
    }

    function openStage(tile) {
      if (stageOpen) return;
      stageOpen = true;
      hydrate(tile);
      stage.classList.add("open");
    }

    function closeStage() {
      if (!stageOpen) return;
      stageOpen = false;
      stage.classList.remove("open");
    }

    tiles.forEach(tile => {
      tile.addEventListener("click", () => openStage(tile));
    });

    // Click outside the card → close. The card is a clean rectangle, so a
    // simple bounding-box check is enough; no radial math needed here.
    stage.addEventListener("click", (e) => {
      if (!card.contains(e.target)) closeStage();
    });

    // Escape → close
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && stageOpen) closeStage();
    });

    // Scroll away → close (debounced)
    let scrollTimer = null;
    window.addEventListener("scroll", () => {
      if (!stageOpen) return;
      if (scrollTimer) clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        const rect = root.getBoundingClientRect();
        if (rect.bottom < 0 || rect.top > window.innerHeight) closeStage();
      }, 80);
    }, { passive: true });
  }
})();
</script>

<script>
// Safe to place this <script> anywhere — defers to DOMContentLoaded if
// the artifact markup isn't in the DOM yet.
(function () {
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  function init() {
  // ── geometry ──────────────────────────────────────────────────────────
  const CX = 500, CY = 380, RADIUS = 270;
  const BASE_FONT = 34;
  const ANIM_MS   = 1900;
  const LAUNCH_MS = 800;
  const SVG_NS    = "http://www.w3.org/2000/svg";

  // Pulse: ~one breath every 5.5s. Phase-offset per word so the field
  // undulates rather than blinks in unison. Amplitudes are deliberately
  // small — the layout reads as alive without anything actually moving
  // off its angular slot, so word #1 stays anchored at 12 o'clock.
  const PULSE_HZ        = 1 / 5.5;
  const RADIUS_PULSE    = 4;          // px, in-and-out along the radial
  const OPACITY_PULSE   = 0.12;       // ±, oscillates around 1
  const CIRCLE_PULSE    = 0.07;       // guide-circle stroke opacity swing

  // word index i with N total → angle, with word 0 anchored at 12 o'clock
  function naturalAngle(i, n) {
    return -Math.PI / 2 + (i / Math.max(1, n)) * 2 * Math.PI;
  }

  // ── state ─────────────────────────────────────────────────────────────
  let words      = [];
  let nextId     = 0;
  let launchId   = null;
  let launchTimer = null;
  let playing    = null;     // null | "reverse" | "shuffle" | "sort"
  let animAngles = null;
  let currentAnim = null;

  // Pulse clock — references inside the render loop so attributes update
  // without rebuilding any DOM.
  const t0 = performance.now();

  // ── DOM refs ──────────────────────────────────────────────────────────
  const root        = document.getElementById("ct-root");
  const input       = document.getElementById("ct-in");
  const wordsGroup  = document.getElementById("ct-words");
  const modeButtons = Array.from(document.querySelectorAll(".ct-mode"));
  const readoutText = document.getElementById("ct-readout-text");

  // ── render ────────────────────────────────────────────────────────────
  // Rebuilds the SVG nodes only when word set / play state changes.
  // The pulse loop below mutates attributes on these nodes in place, so
  // continuous animation never thrashes the DOM.
  // wordNodes maps id → { word: <text>, label: <text>, angle: number, isLaunching: bool }
  const wordNodes = new Map();
  const guideCircle = document.getElementById("ct-circle");

  function render() {
    const N = words.length;

    // Remove nodes for words that no longer exist
    for (const [id, nodes] of wordNodes) {
      if (!words.find(w => w.id === id)) {
        nodes.word.remove();
        if (nodes.label) nodes.label.remove();
        wordNodes.delete(id);
      }
    }

    words.forEach((w, i) => {
      const ang = (playing && animAngles) ? animAngles[i] : naturalAngle(i, N);
      const isLaunching = launchId === w.id;
      const isFirst = i === 0;

      let entry = wordNodes.get(w.id);
      if (!entry) {
        const text = document.createElementNS(SVG_NS, "text");
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("dominant-baseline", "central");
        text.setAttribute("font-family", "Spectral, Georgia, serif");
        text.setAttribute("font-size", BASE_FONT);
        text.setAttribute("fill", "currentColor");
        text.style.transition = "font-weight 0.3s ease";
        text.textContent = w.text;
        wordsGroup.appendChild(text);

        const lbl = document.createElementNS(SVG_NS, "text");
        lbl.setAttribute("text-anchor", "middle");
        lbl.setAttribute("dominant-baseline", "central");
        lbl.setAttribute("font-family", "ui-monospace, monospace");
        lbl.setAttribute("font-size", "10");
        lbl.setAttribute("fill", "#9a9a9a");
        lbl.style.pointerEvents = "none";
        wordsGroup.appendChild(lbl);

        entry = { word: text, label: lbl };
        wordNodes.set(w.id, entry);
      }

      entry.angle       = ang;
      entry.index       = i;
      entry.isLaunching = isLaunching;
      entry.word.setAttribute("font-weight", isFirst ? 500 : 400);
      entry.label.textContent = i + 1;
      entry.label.setAttribute("opacity", isLaunching ? 0 : 0.55);
    });

    // mode buttons enabled state + active highlight
    modeButtons.forEach(btn => {
      btn.disabled = words.length < 2;
      btn.classList.toggle("on", playing === btn.dataset.mode);
    });

    // readout (flat sentence in reading order)
    if (words.length === 0) {
      readoutText.innerHTML = '<span class="ct-empty">your sentence will appear here</span>';
    } else {
      readoutText.textContent = words.map(w => w.text).join(" ");
    }
  }

  // ── pulse loop ────────────────────────────────────────────────────────
  // Runs every frame. Updates x/y/opacity on existing nodes; never touches
  // the DOM tree. Three layered motions, each phase-offset per word so the
  // field feels organic rather than synchronised:
  //   1. Radial bob — each word drifts in and out 4px along its own radial
  //   2. Opacity breath — ±12% around full opacity
  //   3. Guide-circle heartbeat — stroke opacity swings ±7%
  function pulseTick(now) {
    const s = (now - t0) / 1000;
    const N = words.length;

    // Guide circle heartbeat
    const heart = 0.16 + Math.sin(s * PULSE_HZ * 2 * Math.PI) * CIRCLE_PULSE;
    guideCircle.setAttribute("stroke-opacity", heart.toFixed(3));

    // Per-word pulse
    let i = 0;
    for (const [, entry] of wordNodes) {
      const phase    = i * 0.8;
      const breathe  = Math.sin(s * PULSE_HZ * 2 * Math.PI + phase);
      const radius   = RADIUS + breathe * RADIUS_PULSE;
      const x  = CX + radius * Math.cos(entry.angle);
      const y  = CY + radius * Math.sin(entry.angle);
      const lx = CX + (radius + 28) * Math.cos(entry.angle);
      const ly = CY + (radius + 28) * Math.sin(entry.angle);
      const op = entry.isLaunching ? 0 : 1 + breathe * OPACITY_PULSE;

      entry.word.setAttribute("x", x.toFixed(1));
      entry.word.setAttribute("y", y.toFixed(1));
      entry.word.setAttribute("opacity", op.toFixed(3));
      entry.label.setAttribute("x", lx.toFixed(1));
      entry.label.setAttribute("y", ly.toFixed(1));
      i++;
    }
    requestAnimationFrame(pulseTick);
  }
  requestAnimationFrame(pulseTick);

  // ── launch echo (the fade-up element shown above the input) ───────────
  function showLaunch(text) {
    const node = document.createElement("div");
    node.className = "ct-launch";
    node.textContent = text;
    root.appendChild(node);
    setTimeout(() => node.remove(), LAUNCH_MS + 50);
  }

  // ── typing ────────────────────────────────────────────────────────────
  function sendWord(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    const id = nextId++;
    words.push({ id, text: trimmed });
    launchId = id;
    showLaunch(trimmed);
    input.value = "";
    if (launchTimer) clearTimeout(launchTimer);
    launchTimer = setTimeout(() => {
      if (launchId === id) {
        launchId = null;
        render();
      }
    }, LAUNCH_MS);
    render();
  }

  // Composition flag — true while IME is composing (Japanese, Chinese, etc).
  // Without this, the space-to-launch trigger can fire during composition.
  let composing = false;
  input.addEventListener("compositionstart", () => { composing = true; });
  input.addEventListener("compositionend",   () => { composing = false; });

  input.addEventListener("input", (e) => {
    if (composing) return;
    const v = e.target.value;
    if (v.endsWith(" ")) sendWord(v.slice(0, -1));
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && input.value === "" && words.length > 0) {
      e.preventDefault();
      const last = words.pop();
      input.value = last.text;
      render();
    }
  });

  root.addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") input.focus();
  });

  // ── play: animate from current order to a target order ───────────────
  // Each mode produces a different target permutation, but uses the same
  // collapse animation (shortest-arc rotation, cubic ease in/out).
  // playing is now a string ("reverse" | "shuffle" | "sort") or null.

  function computeTarget(mode) {
    const N = words.length;
    if (mode === "reverse") {
      return words.slice().reverse();
    }
    if (mode === "shuffle") {
      // Fisher-Yates, guaranteed to differ from current if N >= 2
      let next;
      let attempts = 0;
      do {
        next = words.slice();
        for (let i = N - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [next[i], next[j]] = [next[j], next[i]];
        }
        attempts++;
      } while (attempts < 8 && next.every((w, i) => w.id === words[i].id));
      return next;
    }
    if (mode === "sort") {
      // Alphabetical by lowercased text
      return words.slice().sort((a, b) =>
        a.text.toLowerCase().localeCompare(b.text.toLowerCase())
      );
    }
    return words.slice();
  }

  function play(mode) {
    if (words.length < 2 || playing) return;
    playing = mode;

    const N = words.length;
    const target = computeTarget(mode);
    const source = words.map((_, i) => naturalAngle(i, N));
    // For each *current* word, where in the target list does it land?
    const dest = words.map(w => {
      const targetIdx = target.findIndex(t => t.id === w.id);
      return naturalAngle(targetIdx, N);
    });
    const start  = performance.now();
    const run = { done: false, raf: null, safety: null };
    currentAnim = run;

    function finish() {
      if (run.done) return;
      run.done = true;
      if (run.raf)    cancelAnimationFrame(run.raf);
      if (run.safety) clearTimeout(run.safety);
      words = target;
      animAngles = null;
      playing = null;
      currentAnim = null;
      render();
    }

    function tick(now) {
      if (run.done || currentAnim !== run) return;
      const t = Math.min(1, (now - start) / ANIM_MS);
      const eased = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
      animAngles = source.map((s, i) => {
        let delta = dest[i] - s;
        if (delta >  Math.PI) delta -= 2 * Math.PI;
        if (delta < -Math.PI) delta += 2 * Math.PI;
        return s + delta * eased;
      });
      render();
      if (t < 1) run.raf = requestAnimationFrame(tick);
      else finish();
    }

    run.raf    = requestAnimationFrame(tick);
    run.safety = setTimeout(finish, ANIM_MS + 250);
    render();
  }

  modeButtons.forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      play(btn.dataset.mode);
      input.focus();
    });
  });

  // ── initial paint ─────────────────────────────────────────────────────
  // Note: we deliberately do NOT call input.focus() here. If the widget
  // sits below the fold, auto-focusing would scroll the page to it on load.
  // The input still focuses on any click within the widget.
  render();

  // ── tile-and-stage open/close ─────────────────────────────────────────
  // Mirrors the word-play pattern: a small tile sits in the gallery; click
  // it to expand into a focused stage. Loose dismissal — click anywhere
  // outside the playfield, press Escape, or scroll away from the tile.
  const tile  = document.getElementById("ct-tile");
  const stage = document.getElementById("ct-stage");
  const playfield = document.getElementById("ct-root");
  let stageOpen = false;

  function openStage() {
    if (stageOpen) return;
    stageOpen = true;
    stage.classList.add("open");
    // Focus quickly so the blinking caret appears almost immediately —
    // the caret is the user's invitation to type once "type" is gone.
    setTimeout(() => input.focus(), 50);
  }

  function closeStage() {
    if (!stageOpen) return;
    stageOpen = false;
    stage.classList.remove("open");
    input.blur();
  }

  tile.addEventListener("click", openStage);

  // Forgiving exit zone — match word-play's pattern.
  // The circle tool's SVG uses viewBox 1000×760 with the circle at center
  // (500, 380) and radius 270. Visible content (numbered labels, breathing
  // pulse) extends to ~298. SAFE_RADIUS of 350 mirrors word-play's ratio
  // of safe-radius to game-extent. Clicks beyond this radius from center
  // close the stage; everything inside is protected.
  //
  // Interactive widgets (input, mode buttons, readout) live outside the
  // circle's radius but should NOT trigger close — they're handled via
  // e.target.closest() before the geometric check runs.
  const SAFE_RADIUS_CT = 350;

  stage.addEventListener("click", (e) => {
    // Interactive elements always pass through, regardless of position.
    if (e.target.closest("#ct-in, #ct-modes, .ct-mode, #ct-readout")) return;

    // Compute click position relative to the SVG's center in viewBox units.
    const svgEl = document.getElementById("ct-svg");
    if (!svgEl) return;
    const rect  = svgEl.getBoundingClientRect();
    const cx    = rect.left + rect.width  / 2;
    const cy    = rect.top  + rect.height / 2;
    // viewBox is 1000 wide → translate pixel distance into viewBox units.
    const pxPerUnit = rect.width / 1000;
    const dx = (e.clientX - cx) / pxPerUnit;
    const dy = (e.clientY - cy) / pxPerUnit;
    const dist = Math.hypot(dx, dy);

    if (dist > SAFE_RADIUS_CT) closeStage();
  });

  // Escape key → close
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && stageOpen) closeStage();
  });

  // Scroll away from the tile's section → close (debounced)
  let ctScrollTimer = null;
  window.addEventListener("scroll", () => {
    if (!stageOpen) return;
    if (ctScrollTimer) clearTimeout(ctScrollTimer);
    ctScrollTimer = setTimeout(() => {
      const rect = tile.getBoundingClientRect();
      if (rect.bottom < 0 || rect.top > window.innerHeight) closeStage();
    }, 80);
  }, { passive: true });

  } // end init
})();
</script>

                  "name", "fire", "promise", "garden", "window", "story",
                  "silence", "answer", "map", "candle", "feather",
                  "mountain", "memory", "bridge", "coin", "ring", "book",
                  "lantern", "rope", "anchor", "shell", "tide", "hour",
                  "minute", "voice", "echo", "shadow", "ghost", "light",
                  "dark", "rain", "leaf", "branch", "root", "salt",
                  "honey", "wine", "blade", "thread", "needle", "sail"],

                  "basement", "tower", "meadow", "orchard", "vineyard",
                  "marsh", "cave", "tunnel", "stairwell"],
  };

  // ── templates — what kind of sentences we build ─────────────────────
  // The game cycles these as the player completes them. Each adds slight
  // variation in cadence so the emerging sentences feel different.
  const TEMPLATES = [
    ["article", "subject", "verb", "object"],
    ["article", "adjective", "subject", "verb"],
    ["subject", "verb", "preposition", "place"],
    ["article", "subject", "verb", "adjective", "object"],
    ["article", "adjective", "subject", "verb", "preposition", "place"],
    ["subject", "verb", "article", "adjective", "object"],
    ["preposition", "place", "article", "subject", "verb"],
  ];

  // ── geometry ────────────────────────────────────────────────────────
  const CENTER_X = 300;
  const CENTER_Y = 300;
  const RING_R   = 180;
  const TIER_1_R = 220;   // inner stack (closer to ring)
  const TIER_2_R = 270;   // outer stack (pushed out)
  const TARGET_ANGLE = -Math.PI / 2;  // 12 o'clock, screen coords

  const DIP_WIDTH = 0.14; // ~8° per dip — small enough to dodge, threatening enough

  // ── DOM refs ────────────────────────────────────────────────────────
  const tile      = document.getElementById("wr-tile");
  const stage     = document.getElementById("wr-stage");
  const playfield = document.getElementById("wr-playfield");
  const svg       = document.getElementById("wr-svg");
  const dipsG     = document.getElementById("wr-dips");
  const spokesG   = document.getElementById("wr-spokes");
  const flying    = document.getElementById("wr-flying");
  const center    = document.getElementById("wr-center");
  const current   = document.getElementById("wr-current");
  const scoreEl   = document.getElementById("wr-score");
  const bestEl    = document.getElementById("wr-best");
  const overEl    = document.getElementById("wr-over");
  const overSent  = document.getElementById("wr-over-sentence");
  const overMeta  = document.getElementById("wr-over-meta");
  const restartBtn= document.getElementById("wr-restart");

  // ── state ───────────────────────────────────────────────────────────
  let isOpen   = false;
  let ringAngle = 0;
  let ringSpeed = 0.00075;
  // each entry: { word, angle, part, tier }   tier 1 = inner, 2 = outer
  let landed   = [];
  // each entry: { angle, width }
  let dips     = [];
  let template = [];
  let slotIdx  = 0;
  let currentWord = "";
  let currentPart = "";
  let score    = 0;
  let best     = parseInt(localStorage.getItem("wr-best") || "0", 10);
  let launching= false;
  let dead     = false;
  let rafId    = null;
  let lastTs   = 0;

  bestEl.textContent = best;

  // ── helpers ─────────────────────────────────────────────────────────
  const rand = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function pickWord(part) { return rand(WORDS[part] || WORDS.subject); }

  function newTemplate() {
    template = rand(TEMPLATES);
    slotIdx = 0;
  }

  function loadNextWord() {
    if (slotIdx >= template.length) {
      score += 3;  // small completion bonus
      newTemplate();
    }
    currentPart = template[slotIdx];
    currentWord = pickWord(currentPart);
    current.textContent = currentWord;

  // Normalize a signed angle delta to (-π, π]
  function angDelta(a, b) {
    let d = a - b;
    while (d >  Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    return d;
  }

  // Pick a random angle that doesn't conflict with existing dips/words.
  function freshAngle(forbidWidth) {
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * 2 * Math.PI;
      let ok = true;
      for (const d of dips) {
        if (Math.abs(angDelta(a, d.angle)) < (forbidWidth + d.width)) { ok = false; break; }
      }
      if (!ok) continue;
      for (const l of landed) {
        if (Math.abs(angDelta(a, l.angle)) < forbidWidth + 0.18) { ok = false; break; }
      }
      if (ok) return a;
    }
    return Math.random() * 2 * Math.PI;  // fall back to anywhere
  }

  // Pre-place dips at game start (Level 1: 2 dips).
  function placeDips(n) {
    dips = [];
    for (let i = 0; i < n; i++) {
      dips.push({ angle: freshAngle(DIP_WIDTH * 2), width: DIP_WIDTH });
    }
  }

  // What's at the target right now? Returns:
  //   { type: "dip" } if a dip is overhead
  //   { type: "word", item, tier: 1|2|"full" } if a word stack is there
  //   { type: "free" } otherwise
  function whatIsAtTarget() {
    // Target is at TARGET_ANGLE in screen coords.
    // Each item's "screen angle" = item.angle + ringAngle.
    // Find anything whose screen angle is within ~0.1 rad of target.
    const HIT = 0.09;  // collision radius in radians

    for (const d of dips) {
      if (Math.abs(angDelta(d.angle + ringAngle, TARGET_ANGLE)) < (HIT + d.width / 2)) {
        return { type: "dip" };
      }
    }
    // collect any landed words near the target, grouped by their stack column
    const hits = landed.filter(l =>
      Math.abs(angDelta(l.angle + ringAngle, TARGET_ANGLE)) < HIT
    );
    if (hits.length === 0) return { type: "free" };
    // sort by tier — if both tiers are occupied here, stack is full
    const tiers = hits.map(h => h.tier);
    if (tiers.includes(1) && tiers.includes(2)) {
      return { type: "word", tier: "full", item: hits[0] };
    }
    // there's just one word here, on tier 1 (the normal case)
    return { type: "word", tier: 1, item: hits[0] };
  }

  // ── render ──────────────────────────────────────────────────────────
  function renderLanded() {
    while (spokesG.firstChild) spokesG.removeChild(spokesG.firstChild);
    for (const item of landed) {
      const a = item.angle + ringAngle;
      const innerR = RING_R;
      const outerR = item.tier === 1 ? TIER_1_R : TIER_2_R;
      const x1 = CENTER_X + innerR * Math.cos(a);
      const y1 = CENTER_Y + innerR * Math.sin(a);
      const x2 = CENTER_X + outerR * Math.cos(a);
      const y2 = CENTER_Y + outerR * Math.sin(a);

      // tether line
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x1); line.setAttribute("y1", y1);
      line.setAttribute("x2", x2); line.setAttribute("y2", y2);
      line.setAttribute("stroke", "#1a1a1a");
      line.setAttribute("stroke-width", item.tier === 1 ? "1" : "0.7");
      spokesG.appendChild(line);

      // word slightly beyond the tether end
      const labelR = outerR + 20;
      const wx = CENTER_X + labelR * Math.cos(a);
      const wy = CENTER_Y + labelR * Math.sin(a);
      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", wx);
      t.setAttribute("y", wy);
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("dominant-baseline", "central");
      t.setAttribute("font-family", "ui-monospace, monospace");
      t.setAttribute("font-size", item.tier === 1 ? "16" : "14");
      t.setAttribute("fill", item.tier === 1 ? "#1a1a1a" : "#5a5a5a");
      t.textContent = item.word;
      spokesG.appendChild(t);
    }
  }

  function renderDips() {
    while (dipsG.firstChild) dipsG.removeChild(dipsG.firstChild);
    for (const d of dips) {
      const a = d.angle + ringAngle;
      // dip is a small inward notch — drawn as two tick marks creating a V
      const a1 = a - d.width / 2;
      const a2 = a + d.width / 2;
      const xOuter1 = CENTER_X + RING_R * Math.cos(a1);
      const yOuter1 = CENTER_Y + RING_R * Math.sin(a1);
      const xOuter2 = CENTER_X + RING_R * Math.cos(a2);
      const yOuter2 = CENTER_Y + RING_R * Math.sin(a2);
      const xInner  = CENTER_X + (RING_R - 14) * Math.cos(a);
      const yInner  = CENTER_Y + (RING_R - 14) * Math.sin(a);
      // erase the ring section underneath the dip
      const erase = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const erasePath = `M ${xOuter1} ${yOuter1} A ${RING_R} ${RING_R} 0 0 1 ${xOuter2} ${yOuter2}`;
      erase.setAttribute("d", erasePath);
      erase.setAttribute("stroke", "#f5f3ee");
      erase.setAttribute("stroke-width", "3");
      erase.setAttribute("fill", "none");
      dipsG.appendChild(erase);
      // V shape (notch inward)
      const v = document.createElementNS("http://www.w3.org/2000/svg", "path");
      v.setAttribute("d", `M ${xOuter1} ${yOuter1} L ${xInner} ${yInner} L ${xOuter2} ${yOuter2}`);
      v.setAttribute("stroke", "#1a1a1a");
      v.setAttribute("stroke-width", "1");
      v.setAttribute("fill", "none");
      dipsG.appendChild(v);
    }
  }

  // ── main loop ───────────────────────────────────────────────────────
  function loop(ts) {
    if (!isOpen || dead) { rafId = null; return; }
    if (!lastTs) lastTs = ts;
    const dt = ts - lastTs;
    lastTs = ts;
    ringAngle += ringSpeed * dt;
    renderLanded();
    renderDips();
    rafId = requestAnimationFrame(loop);
  }

  function startLoop() {
    if (rafId) cancelAnimationFrame(rafId);
    lastTs = 0;
    rafId = requestAnimationFrame(loop);
  }

  // ── launch ──────────────────────────────────────────────────────────
  function launch() {
    if (launching || dead || !isOpen) return;
    launching = true;
    center.style.opacity = "0";

    const word = currentWord;
    const part = currentPart;

    flying.textContent = word;
    flying.setAttribute("opacity", "1");
    const targetX = CENTER_X;
    const targetY = CENTER_Y - RING_R;  // landing at top of ring
    const flightMs = 240;
    const startMs = performance.now();

    function flightTick(now) {
      const t = Math.min(1, (now - startMs) / flightMs);
      const eased = 1 - Math.pow(1 - t, 3);
      const fx = CENTER_X + (targetX - CENTER_X) * eased;
      const fy = CENTER_Y + (targetY - CENTER_Y) * eased;
      flying.setAttribute("x", fx);
      flying.setAttribute("y", fy);
      if (t < 1) {
        requestAnimationFrame(flightTick);
      } else {
        resolveLanding(word, part);
      }
    }
    requestAnimationFrame(flightTick);
  }

  function resolveLanding(word, part) {
    const at = whatIsAtTarget();
    // The angular position to attach to (so it rotates with the ring)
    const landAngle = TARGET_ANGLE - ringAngle;

    if (at.type === "dip") {
      // Quiet fall — word fades into the ring, sentence reveals
      gentleFallIntoRing(word, () => endRun(word, part));
      return;
    }

    if (at.type === "word" && at.tier === "full") {
      // Both tiers occupied. Treat as if it's a dip — sentence ends.
      // (Rare with stack cap 2, but possible.)
      gentleFallIntoRing(word, () => endRun(word, part));
      return;
    }

    if (at.type === "word") {
      // Promote the existing word to tier 2; new word takes tier 1.
      at.item.tier = 2;
      landed.push({ word, angle: landAngle, part, tier: 1 });
    } else {
      // Free — land on tier 1.
      landed.push({ word, angle: landAngle, part, tier: 1 });
    }

    score++;
    scoreEl.textContent = score;
    flying.setAttribute("opacity", "0");
    slotIdx++;
    loadNextWord();
    center.style.opacity = "1";
    launching = false;
  }

  // Word continues inward and fades — gentle, no crash sound
  function gentleFallIntoRing(word, done) {
    const startMs = performance.now();
    const fallMs = 380;
    const startX = parseFloat(flying.getAttribute("x"));
    const startY = parseFloat(flying.getAttribute("y"));
    function fallTick(now) {
      const t = Math.min(1, (now - startMs) / fallMs);
      const eased = t * t;
      // travel a short way past the ring inward (~30 units)
      const dx = (CENTER_X - startX) * 0.15;
      const dy = (CENTER_Y - startY) * 0.15;
      flying.setAttribute("x", startX + dx * eased);
      flying.setAttribute("y", startY + dy * eased);
      flying.setAttribute("opacity", String(1 - t));
      if (t < 1) requestAnimationFrame(fallTick);
      else done();
    }
    requestAnimationFrame(fallTick);
  }

  // ── end of run ──────────────────────────────────────────────────────
  function endRun(failedWord, failedPart) {
    dead = true;
    launching = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;

    // Build the sentence in reading order:
    //   clockwise from 12 o'clock, and at each radial position, tier 1 then tier 2.
    // Each landed word has an "angle" (its fixed position on the ring).
    // Read clockwise: sort by angle from TARGET_ANGLE going clockwise (positive Δ).
    const groups = new Map();  // angle → [tier1?, tier2?]
    for (const l of landed) {
      const key = l.angle.toFixed(3);
      if (!groups.has(key)) groups.set(key, [null, null]);
      const arr = groups.get(key);
      arr[l.tier - 1] = l;
    }
    // turn into [{angle, words}]
    const seq = Array.from(groups.entries()).map(([k, arr]) => {
      const angle = parseFloat(k);
      // delta from TARGET_ANGLE clockwise:
      let cw = TARGET_ANGLE - angle;
      while (cw < 0) cw += 2 * Math.PI;
      return { angle, cw, words: arr.filter(Boolean).map(x => x.word) };
    });
    seq.sort((a, b) => a.cw - b.cw);
    const flat = seq.flatMap(s => s.words);

    if (flat.length === 0) {
      overSent.textContent = "—";
    } else {
      overSent.textContent = flat.join(" ");
    }
    overMeta.textContent = `${flat.length} word${flat.length === 1 ? "" : "s"}`;

    // record best (longest sentence)
    if (flat.length > best) {
      best = flat.length;
      localStorage.setItem("wr-best", String(best));
      bestEl.textContent = best;
    }

    overEl.classList.add("show");
  }

  // ── reset / open / close ────────────────────────────────────────────
  function reset() {
    landed = [];
    score = 0;
    scoreEl.textContent = "0";
    ringAngle = 0;
    launching = false;
    dead = false;
    overEl.classList.remove("show");
    center.style.opacity = "1";
    flying.setAttribute("opacity", "0");
    placeDips(2);  // Level 1 — two dips
    newTemplate();
    loadNextWord();
    renderLanded();
    renderDips();
    startLoop();
  }

  function open() {
    if (isOpen) return;
    isOpen = true;
    stage.classList.add("open");
    reset();
  }
  function close() {
    if (!isOpen) return;
    isOpen = false;
    stage.classList.remove("open");
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    overEl.classList.remove("show");
  }

  // ── input — tap, touch, AND space key ───────────────────────────────
  tile.addEventListener("click", open);

  // The center word is the launch trigger.
  // We bind both click (desktop) and touchstart (mobile) to avoid the
  // 300ms tap delay and double-fire issues on iOS.
  function launchHandler(e) {
    e.preventDefault();
    e.stopPropagation();
    if (dead) return;
    launch();
  }
  center.addEventListener("click", launchHandler);
  center.addEventListener("touchstart", launchHandler, { passive: false });

  // Spacebar launches anywhere on the page while the stage is open
  document.addEventListener("keydown", (e) => {
    if (!isOpen) return;
    if (e.key === " " || e.code === "Space") {
      e.preventDefault();
      if (dead) return;
      launch();
    } else if (e.key === "Escape") {
      close();
    }
  });

  // Forgiving exit zone: any click farther than the game's visible footprint
  // from the playfield center closes the stage. The "game footprint" is the
  // ring + outer spokes (max radius ~290 in SVG units). We use 340 as the
  // safety boundary so tier-2 words and tether lines stay safely inside.
  // The playfield is a square wrapper, so this also catches clicks in its
  // four corners — the dead space that wasn't part of the game anyway.
  const SAFE_RADIUS = 340;

  stage.addEventListener("click", (e) => {
    // Ignore clicks on interactive elements (center word, restart button).
    // Those have their own handlers and shouldn't double-fire.
    if (e.target.closest("#wr-center, #wr-restart")) return;

    // If the game-over reveal is showing, only close on truly outside clicks.
    // The framed sentence box itself should stay clickable territory.
    if (overEl.classList.contains("show") && overEl.contains(e.target)) return;

    // Compute the click position relative to the playfield's center,
    // in the same coordinate space the SVG uses (so SAFE_RADIUS matches).
    const rect = svg.getBoundingClientRect();
    const cx   = rect.left + rect.width  / 2;
    const cy   = rect.top  + rect.height / 2;
    // SVG viewBox is 600 wide; convert pixel distance to viewBox units.
    const pxPerUnit = rect.width / 600;
    const dxUnits = (e.clientX - cx) / pxPerUnit;
    const dyUnits = (e.clientY - cy) / pxPerUnit;
    const dist    = Math.hypot(dxUnits, dyUnits);

    if (dist > SAFE_RADIUS) close();
  });

  // Scroll away closes — with debounce, so tiny scrolls don't fire
  let scrollTimer = null;
  window.addEventListener("scroll", () => {
    if (!isOpen) return;
    if (scrollTimer) clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const rect = tile.getBoundingClientRect();
      if (rect.bottom < 0 || rect.top > window.innerHeight) close();
    }, 80);
  }, { passive: true });

  restartBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    reset();
  });

  } // end init
})();
</script>

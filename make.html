<!-- ═══════════════════════════════════════════════════════════════
     IDEAS + RESONANCE — unified script
     ═══════════════════════════════════════════════════════════════ -->
<script>
(function () {

  // ── Coherence ─────────────────────────────────────────────────────
  // 0 = fully fragmented, 1 = sustained flow.
  // Click (not hold) increments it in steps; it decays slowly when idle.
  let coherence   = 0.0;
  let breathPhase = 0.0;
  let flashAmt    = 0.0;
  let lastFlashIdx = -1;
  let autoFlipFired = false; // unused, kept for safety

  const CLICK_INCREMENT  = 0.28;   // ~4 clicks to Sustained Flow
  const DECAY_RATE       = 0.08;   // decays meaningfully between clicks
  const FLASH_THRESHOLDS = [0.25, 0.50, 0.75, 1.0];
  const STATES = [
    { min: 0.00, label: 'Fragmented',     cls: ''          },
    { min: 0.25, label: 'Coupling',       cls: 'coupling'  },
    { min: 0.55, label: 'Resonance',      cls: 'resonance' },
    { min: 0.85, label: 'Sustained Flow', cls: 'flow'      },
  ];

  function getState(c) {
    let s = STATES[0];
    for (const st of STATES) { if (c >= st.min) s = st; }
    return s;
  }

  // ── Resonance biological animation ───────────────────────────────
  //
  // Three layered rhythms:
  //   BREATH  — 10s cycle (5–6 breaths/min), drives core and, at high
  //             coherence, the whole network inhaling/exhaling together.
  //   HEART   — ~1Hz per node, each with its own slightly different rate.
  //             As coherence rises they entrain to the same beat.
  //   ORBIT   — slow rotation, phase-locks as coherence rises.
  //
  // Tap/click: bumps coherence AND injects a phase-correction impulse
  // that snaps all node phases toward the shared frequency — the
  // "metronome tap" that pulls drifting musicians into time.
  //
  // Lock-in wave: at Sustained Flow, a radial pulse propagates outward
  // from the core through the nodes in sequence, like fireflies syncing.

  const BREATH_PERIOD  = 10.0;    // seconds (5–6 breaths/min)
  const HEART_BASE     = 1.05;    // Hz, shared heartbeat frequency
  const HEART_SPREAD   = 0.18;    // ± individual variation at c=0
  const N_NODES        = 8;
  const ORBIT_SPEED    = 0.28;    // rad/s shared rotation

  // Per-node own heartbeat frequency (fixed, derived from index)
  const nodeOwnHz = Array.from({ length: N_NODES }, (_, i) =>
    HEART_BASE + (i / (N_NODES - 1) - 0.5) * 2 * HEART_SPREAD
  );

  // Phase-correction state: how much each node's accumulated phase
  // has been nudged toward the shared phase by taps.
  // Starts at 0 (no correction); each tap adds a correction impulse.
  let nodePhaseCorrection = new Array(N_NODES).fill(0);
  let lockWave = 0;   // 0..1 lock-in wave progress, fires at Sustained Flow

  function tapCorrect() {
    // Each tap injects a phase-reset nudge on all nodes proportional
    // to how far each is from the shared phase. The further a node is
    // from sync, the harder it gets pulled. This makes taps feel like
    // a stabilising hand rather than a binary toggle.
    for (let i = 0; i < N_NODES; i++) {
      nodePhaseCorrection[i] = Math.min(1, nodePhaseCorrection[i] + 0.22);
    }
  }

  function drawResonance(ctx, cx, cy, R, c, t, breath, flash) {
    ctx.clearRect(0, 0, cx * 2, cy * 2);

    const breathCycle = Math.PI * 2 / BREATH_PERIOD;
    const breathVal   = Math.sin(t * breathCycle) * 0.5 + 0.5;

    // Ink colour flips with page inversion
    const dark = document.body.classList.contains('nf-inverted');
    const ink  = dark ? '230,229,224' : '26,26,26';
    const K    = (a) => `rgba(${ink},${typeof a === 'number' ? a.toFixed(3) : a})`;

    // ── Ambient field ──────────────────────────────────────────────────
    const fieldAlpha = 0.05 + c * 0.10 + breathVal * c * 0.04;
    const bg = ctx.createRadialGradient(cx, cy, 2, cx, cy, R);
    bg.addColorStop(0, K(fieldAlpha.toFixed(3)));
    bg.addColorStop(1, K(0));
    ctx.fillStyle = bg; ctx.fillRect(0, 0, cx * 2, cy * 2);

    // ── Rings: nested shells with depth hierarchy ──────────────────────
    // Inner rings are heavier; outer rings are faint traces.
    // Wobble decays with coherence — rings stabilise as system locks in.
    const ringDefs = [
      { frac: 0.28, wt: 1.0 },   // innermost — heaviest
      { frac: 0.46, wt: 0.65 },
      { frac: 0.65, wt: 0.40 },
      { frac: 0.85, wt: 0.20 },  // outermost — barely-there trace
    ];
    for (let ri = 0; ri < ringDefs.length; ri++) {
      const { frac, wt } = ringDefs[ri];
      const base       = R * frac;
      const wobble     = Math.sin(t * (0.7 - c * 0.3) + ri * 1.6) * 3.5 * (1 - c);
      const breathSync = Math.sin(t * breathCycle + ri * 0.3) * R * 0.016 * c;
      const alpha = (0.13 + c * 0.16 + breathVal * c * 0.06) * wt;
      ctx.beginPath();
      ctx.strokeStyle = K(alpha.toFixed(3));
      ctx.lineWidth   = (0.7 + c * 0.5) * wt;
      ctx.arc(cx, cy, base + wobble + breathSync, 0, Math.PI * 2);
      ctx.stroke();
    }

    // ── Flash ring ─────────────────────────────────────────────────────
    if (flash > 0) {
      ctx.beginPath();
      ctx.strokeStyle = K((flash * 0.32).toFixed(3));
      ctx.lineWidth   = 0.8 + flash * 2;
      ctx.arc(cx, cy, R * 0.50 + flash * R * 0.12, 0, Math.PI * 2);
      ctx.stroke();
    }

    // ── Lock-in wave ───────────────────────────────────────────────────
    const lockNodeFlash = new Array(N_NODES).fill(0);
    if (lockWave > 0) {
      const waveR = R * 0.15 + lockWave * R * 0.85;
      ctx.beginPath();
      ctx.strokeStyle = K((Math.max(0, (1 - lockWave) * 0.30)).toFixed(3));
      ctx.lineWidth   = 0.8 + (1 - lockWave) * 1.5;
      ctx.arc(cx, cy, waveR, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < N_NODES; i++) {
        lockNodeFlash[i] = Math.max(0, 1 - Math.abs(lockWave - i / N_NODES) * N_NODES * 1.2);
      }
    }

    // ── Nodes: two shells with counter-rotation ────────────────────────
    // Inner 4 nodes orbit closer, rotate clockwise.
    // Outer 4 nodes orbit further, rotate counter-clockwise.
    // This gives the classic atom aesthetic — nested shells moving independently.
    const sharedHeart = HEART_BASE;
    const sharedPhase = t * sharedHeart * Math.PI * 2;

    for (let i = 0; i < N_NODES; i++) {
      const shell = i < N_NODES / 2 ? 0 : 1;  // 0 = inner, 1 = outer

      // Shell radii: inner orbits at ~42%, outer at ~62% of R
      const baseOrbitR = shell === 0
        ? R * (0.42 + Math.sin(t * 0.12 + i) * 0.04 * (1 - c))
        : R * (0.62 + Math.sin(t * 0.09 + i) * 0.04 * (1 - c));

      // Counter-rotation: inner goes forward, outer goes back
      const rotDir  = shell === 0 ? 1 : -1;
      const rotRate = shell === 0 ? ORBIT_SPEED : ORBIT_SPEED * 0.7;

      // At low c: each node has its own angular speed (fragmented).
      // At high c: all nodes in a shell rotate together.
      const a           = i * Math.PI * 2 / (N_NODES / 2);  // angle within shell
      const ownRate     = rotRate * (0.85 + (i % 4) * 0.08);
      const sharedRate  = rotRate;
      const orbitAngle  = a + rotDir * t * (ownRate * (1 - c) + sharedRate * c);

      // Heartbeat: each node's own phase, entrained toward shared as c rises
      const ownHz    = nodeOwnHz[i];
      const hz       = ownHz * (1 - c) + sharedHeart * c;
      const rawPhase = t * hz * Math.PI * 2;
      const phaseDiff = sharedPhase - rawPhase;
      const corrected = rawPhase + phaseDiff * nodePhaseCorrection[i];
      const heartbeat = Math.sin(corrected) * 0.5 + 0.5;
      nodePhaseCorrection[i] = Math.max(0, nodePhaseCorrection[i] - 0.0004);

      // Radial scatter collapses with coherence
      const scatter = R * 0.06 * (1 - c);
      const orbitR  = baseOrbitR + Math.sin(rawPhase * 0.5 + i) * scatter;

      const nx = cx + Math.cos(orbitAngle) * orbitR;
      const ny = cy + Math.sin(orbitAngle) * orbitR;

      // ── Curved spoke: quadratic bezier from centre, bowing sideways ──
      // Control point offset perpendicular to the spoke direction.
      const spokeAngle = Math.atan2(ny - cy, nx - cx);
      const bow        = R * 0.12 * (1 - c * 0.7) * (i % 2 === 0 ? 1 : -1);
      const cpx = cx + Math.cos(orbitAngle) * orbitR * 0.5 + Math.cos(spokeAngle + Math.PI / 2) * bow;
      const cpy = cy + Math.sin(orbitAngle) * orbitR * 0.5 + Math.sin(spokeAngle + Math.PI / 2) * bow;

      const lineAlpha = 0.16 + c * 0.26 + heartbeat * c * 0.10;
      ctx.beginPath();
      ctx.strokeStyle = K(lineAlpha.toFixed(3));
      ctx.lineWidth   = 0.5 + c * 0.5;
      ctx.moveTo(cx, cy);
      ctx.quadraticCurveTo(cpx, cpy, nx, ny);
      ctx.stroke();

      // ── Node-to-adjacent connection within shell at high coherence ────
      if (c > 0.55) {
        const nextI   = shell === 0 ? (i + 1) % 4 : 4 + (i - 4 + 1) % 4;
        const nextA   = nextI * Math.PI * 2 / (N_NODES / 2);
        const nextOrb = nextA + rotDir * t * (ownRate * (1 - c) + sharedRate * c);
        const nx2 = cx + Math.cos(nextOrb) * orbitR;
        const ny2 = cy + Math.sin(nextOrb) * orbitR;
        ctx.beginPath();
        ctx.strokeStyle = K(((c - 0.55) * 0.30).toFixed(3));
        ctx.lineWidth   = 0.5;
        ctx.moveTo(nx, ny); ctx.lineTo(nx2, ny2); ctx.stroke();
      }

      // ── Node dot with soft halo ────────────────────────────────────
      const flash2   = lockNodeFlash[i];
      const dotBase  = R * (shell === 0 ? 0.026 : 0.020);   // inner nodes slightly larger
      const dotPulse = dotBase * (1 + heartbeat * (0.35 + c * 0.35));
      const dotR     = dotPulse + flash2 * dotBase;
      const dotAlpha = 0.42 + c * 0.50 + heartbeat * c * 0.12 + flash2 * 0.22;

      // Halo: soft radial gradient behind the dot
      const haloR = dotR * 4.5;
      const halo  = ctx.createRadialGradient(nx, ny, 0, nx, ny, haloR);
      halo.addColorStop(0, K((dotAlpha * 0.22).toFixed(3)));
      halo.addColorStop(1, K(0));
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(nx, ny, haloR, 0, Math.PI * 2); ctx.fill();

      // Solid dot
      ctx.beginPath();
      ctx.fillStyle = K(Math.min(0.92, dotAlpha).toFixed(3));
      ctx.arc(nx, ny, Math.max(0.8, dotR), 0, Math.PI * 2);
      ctx.fill();
    }

    // ── Symmetry layer ─────────────────────────────────────────────────
    // A mirrored reflection of the nodes, reflected across the vertical axis.
    // At c=0 it's invisible. As coherence rises it fades in, so the system
    // visually "finds" bilateral symmetry as it synchronises.
    // At Sustained Flow both layers are equal weight — perfectly balanced.
    if (c > 0.05) {
      const symAlpha = c * c;   // quadratic — appears slowly then snaps in
      for (let i = 0; i < N_NODES; i++) {
        const shell    = i < N_NODES / 2 ? 0 : 1;
        const baseOrbitR = shell === 0
          ? R * (0.42 + Math.sin(t * 0.12 + i) * 0.04 * (1 - c))
          : R * (0.62 + Math.sin(t * 0.09 + i) * 0.04 * (1 - c));
        const rotDir   = shell === 0 ? 1 : -1;
        const rotRate  = shell === 0 ? ORBIT_SPEED : ORBIT_SPEED * 0.7;
        const a        = i * Math.PI * 2 / (N_NODES / 2);
        const ownRate  = rotRate * (0.85 + (i % 4) * 0.08);
        const orbitAngle = a + rotDir * t * (ownRate * (1 - c) + rotRate * c);

        const ownHz    = nodeOwnHz[i];
        const hz       = ownHz * (1 - c) + HEART_BASE * c;
        const rawPhase = t * hz * Math.PI * 2;
        const scatter  = R * 0.06 * (1 - c);
        const orbitR   = baseOrbitR + Math.sin(rawPhase * 0.5 + i) * scatter;

        const nx = cx + Math.cos(orbitAngle) * orbitR;
        const ny = cy + Math.sin(orbitAngle) * orbitR;

        // Mirror: reflect x across vertical centre axis
        const mx = cx - (nx - cx);
        const my = ny;

        // Mirrored spoke — curved in opposite bow direction
        const mirrorSpokeAngle = Math.atan2(my - cy, mx - cx);
        const bow = R * 0.12 * (1 - c * 0.7) * (i % 2 === 0 ? -1 : 1);
        const cpx = cx + Math.cos(mirrorSpokeAngle) * orbitR * 0.5 + Math.cos(mirrorSpokeAngle + Math.PI / 2) * bow;
        const cpy = cy + Math.sin(mirrorSpokeAngle) * orbitR * 0.5 + Math.sin(mirrorSpokeAngle + Math.PI / 2) * bow;

        const lineAlpha = (0.16 + c * 0.26) * symAlpha;
        ctx.beginPath();
        ctx.strokeStyle = K(lineAlpha.toFixed(3));
        ctx.lineWidth   = 0.5 + c * 0.5;
        ctx.moveTo(cx, cy);
        ctx.quadraticCurveTo(cpx, cpy, mx, my);
        ctx.stroke();

        // Mirrored dot
        const dotBase  = R * (shell === 0 ? 0.026 : 0.020);
        const dotR     = dotBase * (1 + 0.35 * c);
        const dotAlpha = (0.42 + c * 0.50) * symAlpha;
        const haloR    = dotR * 4.5;
        const halo     = ctx.createRadialGradient(mx, my, 0, mx, my, haloR);
        halo.addColorStop(0, K((dotAlpha * 0.22).toFixed(3)));
        halo.addColorStop(1, K(0));
        ctx.fillStyle = halo;
        ctx.beginPath(); ctx.arc(mx, my, haloR, 0, Math.PI * 2); ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = K(Math.min(0.92, dotAlpha).toFixed(3));
        ctx.arc(mx, my, Math.max(0.8, dotR), 0, Math.PI * 2); ctx.fill();
      }
    }

    // ── Core: breathes, grows with coherence ───────────────────────────
    const breathDepth = 0.012 + c * 0.030;
    const coreR = R * 0.040 + R * breathDepth * breathVal + R * 0.075 * c;

    const glowR = coreR * (3.5 + c * 1.5);
    const glow  = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    glow.addColorStop(0, K((0.12 + c * 0.18 + breathVal * c * 0.06).toFixed(3)));
    glow.addColorStop(1, K(0));
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, glowR, 0, Math.PI * 2); ctx.fill();

    const coreAlpha = 0.38 + c * 0.28 + breathVal * 0.07;
    ctx.beginPath();
    ctx.fillStyle = K(Math.min(0.72, coreAlpha).toFixed(3));
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2); ctx.fill();
  }

  // ── Resonance tile preview ─────────────────────────────────────────
  const resTileCanvas = document.getElementById('resonance-canvas');
  let resT = 0, resLastTs = 0, resRafId = null, resRunning = true;
  if (resTileCanvas) {
    const dpr = window.devicePixelRatio || 1;
    resTileCanvas.width  = 110 * dpr;
    resTileCanvas.height = 110 * dpr;
    resTileCanvas.style.width  = '110px';
    resTileCanvas.style.height = '110px';
    const resCtx = resTileCanvas.getContext('2d');
    resCtx.scale(dpr, dpr);
    if (typeof IntersectionObserver !== 'undefined') {
      new IntersectionObserver(en => { resRunning = en[0].isIntersecting; if (resRunning && !resRafId) resRafId = requestAnimationFrame(resFrame); }, { threshold: 0.1 }).observe(resTileCanvas);
    }
    function resFrame(ts) {
      resRafId = null; if (!resRunning) return;
      const dt = resLastTs ? Math.min(50, ts - resLastTs) / 1000 : 0.016;
      resLastTs = ts; resT += dt;
      if (!stageOpen) coherence = Math.max(0, coherence - DECAY_RATE * dt * 0.1);
      drawResonance(resCtx, 55, 55, 48, Math.max(coherence, 0.15), resT, resT, 0);
      resRafId = requestAnimationFrame(resFrame);
    }
    resRafId = requestAnimationFrame(resFrame);
  }

  // ── Stage ──────────────────────────────────────────────────────────
  const icStage     = document.getElementById('ic-stage');
  const icPlayfield = document.getElementById('ic-playfield');
  const icTitle     = document.getElementById('ic-stage-title');
  const stageCanvas = document.getElementById('ic-stage-canvas');
  const stateLabel  = document.getElementById('ic-state-label');
  const interHint   = document.getElementById('ic-interaction-hint');
  const backEyebrow = document.getElementById('ic-back-eyebrow');
  const backTitle   = document.getElementById('ic-back-title');
  const backSub     = document.getElementById('ic-back-sub');
  const backBody    = document.getElementById('ic-back-body');
  const descOverlay = document.getElementById('ic-desc-overlay');

  let stageOpen    = false;
  let stageRafId   = null;
  let stageT       = 0;
  let lastStageTs  = 0;
  let activeTile   = null;
  let lastStateCls = '';
  let nfStageT     = 0, nfStageLastTs = 0;
  let descRevealed = false;

  // 560px canvas — larger field so the animation has room to breathe
  const SC = 280, SR = 238;

  function openStage(tile) {
    if (stageOpen) return;
    stageOpen    = true;
    descRevealed = false;
    activeTile   = tile.id === 'ic-tile-02' ? 'res' : 'nf';

    const d = tile.dataset;
    if (backEyebrow) backEyebrow.textContent = d.eyebrow || '';
    if (backTitle)   backTitle.textContent   = d.title   || '';
    if (backSub)     backSub.textContent     = d.sub     || '';
    if (backBody)    backBody.textContent    = d.body    || '';
    if (descOverlay) descOverlay.classList.remove('revealed');
    if (icTitle)     icTitle.textContent     = activeTile === 'res' ? 'resonance' : 'notes flow';

    if (stateLabel) stateLabel.style.display = activeTile === 'res' ? '' : 'none';
    if (interHint) {
      interHint.style.display = activeTile === 'res' ? '' : 'none';
      interHint.style.opacity = '';
    }

    updateStateLabel(coherence, true);
    icStage.classList.add('open');
    document.dispatchEvent(new Event('stageopen'));
    stageT = resT; lastStageTs = 0; nfStageT = 0; nfStageLastTs = 0;
    stageRafId = requestAnimationFrame(activeTile === 'res' ? resStageFrame : nfStageFrame);
  }

  function closeStage() {
    if (!stageOpen) return;
    stageOpen    = false;
    descRevealed = false;
    icStage.classList.remove('open');
    if (descOverlay) descOverlay.classList.remove('revealed');
    cancelAnimationFrame(stageRafId); stageRafId = null;
  }

  // Tile clicks
  const tile01 = document.getElementById('ic-tile-01');
  const tile02 = document.getElementById('ic-tile-02');
  if (tile01) tile01.addEventListener('click', () => openStage(tile01));
  if (tile02) tile02.addEventListener('click', () => openStage(tile02));

  // ── Click-out: e.target === icStage means the click landed directly
  // on the fixed fullscreen backdrop, not on any child element.
  // The entire surrounding field is the exit zone — one clear target.
  if (icStage) {
    icStage.addEventListener('click', (e) => {
      if (e.target === icStage) closeStage();
    });
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && stageOpen) closeStage(); });

  let icScrollTimer = null;
  window.addEventListener('scroll', () => {
    if (!stageOpen) return;
    if (icScrollTimer) clearTimeout(icScrollTimer);
    icScrollTimer = setTimeout(() => {
      // Watch either tile — if both are off-screen, close the stage.
      const t1 = document.getElementById('ic-tile-01');
      const t2 = document.getElementById('ic-tile-02');
      const rects = [t1, t2].filter(Boolean).map(el => el.getBoundingClientRect());
      const allGone = rects.every(r => r.bottom < 0 || r.top > window.innerHeight);
      if (allGone) closeStage();
    }, 80);
  }, { passive: true });

  if (stageCanvas) {
    stageCanvas.addEventListener('click', (e) => {
      e.stopPropagation();
      if (activeTile === 'res') {
        coherence = Math.min(1, coherence + CLICK_INCREMENT);
        tapCorrect();
      }
      // NF: no canvas interaction
    });
  }

  function updateStateLabel(c, force) {
    if (!stateLabel) return;
    const s = getState(c);
    if (force || s.cls !== lastStateCls) {
      stateLabel.textContent = s.label;
      stateLabel.className   = 'ic-state-label' + (s.cls ? ' ' + s.cls : '');
      lastStateCls = s.cls;
    }
    const fi = FLASH_THRESHOLDS.findIndex(th => c >= th);
    if (fi > lastFlashIdx) { lastFlashIdx = fi; flashAmt = 1.0; }
    if (c < 0.18) lastFlashIdx = -1;
  }

  // ── Resonance stage loop ───────────────────────────────────────────
  function resStageFrame(ts) {
    stageRafId = null;
    if (!stageOpen || activeTile !== 'res') return;
    const dt = lastStageTs ? Math.min(50, ts - lastStageTs) / 1000 : 0.016;
    lastStageTs = ts; stageT += dt;
    // breathPhase no longer needed — breath is derived from stageT inside drawResonance
    coherence = Math.max(0, coherence - DECAY_RATE * dt);
    flashAmt  = Math.max(0, flashAmt  - dt * 2.0);

    // Advance lock-in wave when Sustained Flow is active
    if (coherence >= 0.85) {
      if (lockWave === 0) lockWave = 0.001;   // trigger
      lockWave = Math.min(1, lockWave + dt * 0.55);   // ~1.8s to cross
      if (lockWave >= 1) lockWave = 0;        // reset for next cycle
    } else {
      lockWave = 0;
    }

    updateStateLabel(coherence, false);

    if (coherence >= 0.85 && !descRevealed) {
      descRevealed = true;
      if (descOverlay) descOverlay.classList.add('revealed');
      if (interHint)   interHint.style.opacity = '0';
    }

    if (stageCanvas) {
      const ctx = stageCanvas.getContext('2d');
      // Pass stageT as both the time driver and the breath driver
      // (breath is computed from t inside drawResonance now)
      drawResonance(ctx, SC, SC, SR, coherence, stageT, stageT, flashAmt);
    }
    stageRafId = requestAnimationFrame(resStageFrame);
  }

  // ── Notes Flow tile — looping airplane ────────────────────────────
  // Plane follows a path that weaves in and out of the tile circle —
  // radius oscillates so it crosses the ring naturally a few times per loop.
  (function () {
    const canvas = document.getElementById('nf-tile-canvas');
    if (!canvas) return;

    const dpr = window.devicePixelRatio || 1;
    canvas.width  = 110 * dpr;
    canvas.height = 110 * dpr;
    canvas.style.width  = '110px';
    canvas.style.height = '110px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const CX = 55, CY = 55, S = 110;
    const SPEED = 58;    // px/s — unhurried glide
    const TRAIL = 120;

    // Straight-line flight with edge wrapping.
    // The plane flies at a fixed angle, exits an edge, reappears on the opposite side.
    // Each pass rotates the angle slightly so the tile gets covered gradually.
    let px = 20, py = 30;
    let angle = 0.42;          // radians — gentle diagonal
    let vx = Math.cos(angle) * SPEED;
    let vy = Math.sin(angle) * SPEED;
    const ANGLE_DRIFT = 0.18;  // radians added each wrap

    function wrap() {
      // Wrap position to opposite edge, nudge angle slightly
      if (px > S + 12) { px -= S + 24; angle += ANGLE_DRIFT; }
      if (px < -12)    { px += S + 24; angle += ANGLE_DRIFT; }
      if (py > S + 12) { py -= S + 24; angle += ANGLE_DRIFT; }
      if (py < -12)    { py += S + 24; angle += ANGLE_DRIFT; }
      vx = Math.cos(angle) * SPEED;
      vy = Math.sin(angle) * SPEED;
    }

    let lastTs = 0;
    const trail = [];
    let rafId = null, running = true;

    if (typeof IntersectionObserver !== 'undefined') {
      new IntersectionObserver(en => {
        running = en[0].isIntersecting;
        if (running && !rafId) rafId = requestAnimationFrame(frame);
      }, { threshold: 0.1 }).observe(canvas);
    }

    function drawPlane(x, y, heading, alpha) {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(heading);
      ctx.globalAlpha = alpha;
      const inkC = document.body.classList.contains('nf-inverted') ? '230,229,224' : '26,26,26';
      ctx.strokeStyle = `rgba(${inkC},1)`;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      const sc = 0.50;
      ctx.scale(sc, sc);
      ctx.lineWidth = 1.1 / sc;
      ctx.beginPath();
      ctx.moveTo( 18,  0); ctx.lineTo(-12,  9);
      ctx.lineTo( -6,  0); ctx.lineTo(-12, -9);
      ctx.closePath(); ctx.stroke();
      ctx.lineWidth = 0.7 / sc;
      ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(-6,0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(-12,-4); ctx.stroke();
      ctx.restore();
    }

    function frame(ts) {
      rafId = null; if (!running) return;
      const dt = lastTs ? Math.min(50, ts - lastTs) / 1000 : 0.016;
      lastTs = ts;

      px += vx * dt;
      py += vy * dt;
      wrap();

      trail.push({ x: px, y: py });
      if (trail.length > TRAIL) trail.shift();

      ctx.clearRect(0, 0, S, S);

      // Circle ring — drawn on canvas so it inverts with the page
      const ringInk = document.body.classList.contains('nf-inverted')
        ? 'rgba(230,229,224,0.45)' : 'rgba(26,26,26,0.45)';
      ctx.beginPath();
      ctx.strokeStyle = ringInk;
      ctx.lineWidth   = 0.8;
      ctx.arc(55, 55, 36, 0, Math.PI * 2);
      ctx.stroke();

      for (let i = 0; i < trail.length; i++) {
        const age = i / (trail.length - 1);
        const op  = age * age * 0.16;
        if (op < 0.003) continue;
        ctx.beginPath();
        const trailInk = document.body.classList.contains('nf-inverted') ? '230,229,224' : '26,26,26';
        ctx.fillStyle = `rgba(${trailInk},${op.toFixed(3)})`;
        ctx.arc(trail[i].x, trail[i].y, 0.85 * age, 0, Math.PI * 2);
        ctx.fill();
      }

      drawPlane(px, py, angle, 0.80);
      rafId = requestAnimationFrame(frame);
    }

    rafId = requestAnimationFrame(frame);
  })();

  // ── Notes Flow stage ───────────────────────────────────────────────
  // Same open playfield as Resonance. Description is visible immediately
  // — no interaction required since there's no animation to earn it.
  // The title and field label do the work; the description is the content.
  function nfStageFrame(ts) {
    stageRafId = null;
    if (!stageOpen || activeTile !== 'nf') return;
    if (!descRevealed) {
      descRevealed = true;
      if (descOverlay) {
        // Small delay so the stage fade-in completes before text appears
        setTimeout(() => descOverlay.classList.add('revealed'), 280);
      }
      if (interHint) interHint.style.display = 'none';
    }
  }
})();
</script>

</body>

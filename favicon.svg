<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Globe Favicon</title>

  <!-- globe circle -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#111111" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- equator -->
  <line x1="4.5" y1="16" x2="27.5" y2="16" fill="none" stroke="#111111" stroke-width="0.7" stroke-linecap="round" opacity="0.45"/>

  <!-- back meridian dashed -->
  <path d="M16,4.5 C10.5,4.5 10.5,27.5 16,27.5" fill="none" stroke="#111111" stroke-width="0.55" stroke-dasharray="1.4,1.4" stroke-linecap="round" opacity="0.22"/>

  <!-- hero meridian -->
  <path d="M16,4.5 C21.5,4.5 21.5,27.5 16,27.5" fill="none" stroke="#111111" stroke-width="1.3" stroke-linecap="round"/>

  <!-- left small cap of tapered cylinder -->
  <ellipse cx="3" cy="16" rx="1.4" ry="3.1" fill="none" stroke="#111111" stroke-width="1.1" stroke-linecap="round"/>

  <!-- top taper line -->
  <line x1="3" y1="12.9" x2="27.5" y2="4.5" fill="none" stroke="#111111" stroke-width="1.1" stroke-linecap="round"/>

  <!-- bottom taper line -->
  <line x1="3" y1="19.1" x2="27.5" y2="27.5" fill="none" stroke="#111111" stroke-width="1.1" stroke-linecap="round"/>

  <!-- right cap front arc -->
  <path d="M27.5,4.5 C31,4.5 31,27.5 27.5,27.5" fill="none" stroke="#111111" stroke-width="1.1" stroke-linecap="round"/>

  <!-- right cap back arc dashed -->
  <path d="M27.5,4.5 C24,4.5 24,27.5 27.5,27.5" fill="none" stroke="#111111" stroke-width="0.65" stroke-dasharray="1.4,1.4" stroke-linecap="round" opacity="0.28"/>

</svg>
